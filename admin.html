<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f766e">
<title>Dashboard Rental & Charter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0f766e;--on-primary:#ffffff;--primary-soft:#dff1ee;
  --bg:#eef2f0;--surface:#ffffff;--ink:#14211f;--muted:#5d6b68;--line:#dbe3e0;--side:#0b2e2b;
  --amber:#f59e0b;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;--ok-soft:rgba(22,163,74,.16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
small{font-size:12.5px}
.mute{color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* ===== Shell ===== */
.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--side);color:#e8f1ef;display:flex;flex-direction:column;padding:20px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 24px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.2)}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand small{opacity:.65}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;padding:11px 12px;border-radius:10px;text-align:left;opacity:.8;width:100%;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button.on{background:var(--primary);color:var(--on-primary);opacity:1;font-weight:700}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.75)}
.side-foot b{color:#fff;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.wrap{margin-left:252px}
.mtop{display:none}
.main{padding:28px 36px 60px;max-width:1320px;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:30px;letter-spacing:-.02em;line-height:1.1}
.top p{color:var(--muted);margin-top:5px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bnav{display:none}
.fab{display:none}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.inv{background:var(--on-primary);border-color:var(--on-primary);color:var(--primary)}
.btn.ghost-inv{background:transparent;border-color:rgba(255,255,255,.45);color:inherit}
.btn.danger{color:var(--bad);border-color:rgba(185,28,28,.35)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;position:relative;flex:none}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn.flat{border-color:transparent;background:transparent}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 6px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.card-b{padding:6px 18px 18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:rgba(22,163,74,.14);color:var(--ok)}
.pill.warn{background:rgba(245,158,11,.18);color:var(--warn)}
.pill.bad{background:rgba(220,38,38,.14);color:var(--bad)}
.pill.info{background:rgba(37,99,235,.13);color:var(--info)}
.pill.mute{background:var(--line);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;white-space:nowrap;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab i{font-style:normal;font-size:12px;opacity:.7}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;min-width:220px;flex:1;max-width:360px}
.search input{border:0;background:none;outline:0;padding:10px 0;width:100%;font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 13px;display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--primary);color:var(--on-primary)}

/* ===== Dashboard ===== */
.hero{background:var(--primary);color:var(--on-primary);border-radius:20px;padding:28px 30px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:30px;right:30px;bottom:14px;height:3px;background:repeating-linear-gradient(90deg,currentColor 0 22px,transparent 22px 44px);opacity:.28;border-radius:3px}
.hero h2{font-family:var(--display);font-size:30px;letter-spacing:-.02em;line-height:1.1}
.hero p{margin-top:8px;opacity:.9;max-width:560px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat .lbl{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
.stat small{display:inline-flex;gap:4px;align-items:center}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
.cols.even{grid-template-columns:1fr 1fr}
.g-scroll{overflow-x:auto;padding:0 18px 14px}
.gantt{min-width:820px}
.g-row{display:grid;grid-template-columns:176px 1fr;align-items:stretch;border-top:1px solid var(--line)}
.g-headrow{border-top:0}
.g-days{display:grid;grid-template-columns:repeat(14,1fr)}
.g-day{display:flex;flex-direction:column;align-items:center;padding:6px 0;font-size:11px;color:var(--muted);border-left:1px solid var(--line)}
.g-day b{font-size:14px;color:var(--ink)}
.g-day.today{background:var(--primary-soft);border-radius:8px 8px 0 0}
.g-day.wk span{color:var(--bad)}
.g-name{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 0;min-width:0}
.g-name .vic{width:34px;height:34px;border-radius:9px}
.g-name b{display:block;font-size:13.5px;line-height:1.2}
.g-name small{color:var(--muted)}
.g-track{position:relative;min-height:52px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/14) 100%}
.g-track::before{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(100%/14);background:var(--primary-soft);opacity:.6}
.g-track.svc{background-color:rgba(245,158,11,.08)}
.g-bar{position:absolute;top:9px;bottom:9px;border:0;border-radius:8px;padding:0 8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:700;z-index:1;text-align:left}
.g-bar span{overflow:hidden;text-overflow:ellipsis}
.g-bar.terjadwal{background:var(--primary);color:var(--on-primary)}
.g-bar.berjalan{background:var(--amber);color:#2b1c00}
.g-bar.selesai{background:var(--ok-soft);color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.vic{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}

/* ===== Booking rows ===== */
.blist{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:12px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--primary-soft)}
.bdate{text-align:center;background:var(--primary-soft);border-radius:10px;padding:7px 0;line-height:1.1}
.brow:hover .bdate{background:var(--surface)}
.bdate b{font-family:var(--display);font-size:20px;display:block}
.bdate span{font-size:11px;color:var(--muted)}
.btitle{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bmeta{display:flex;gap:2px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:3px}
.mi{display:inline-flex;gap:5px;align-items:center}
.bright{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.bright b{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .vic{margin:0 auto 12px;width:52px;height:52px}
.empty p{margin-bottom:12px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ===== Calendar ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cal .dh{padding:8px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.cc{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cc:nth-child(7n){border-right:0}
.cc.out{background:var(--bg);opacity:.7}
.cc.today .cn{background:var(--primary);color:var(--on-primary)}
.cc:hover{background:var(--primary-soft)}
.cn{font-size:12.5px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.chip{border:0;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:700;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;width:100%}
.chip.terjadwal{background:var(--primary);color:var(--on-primary)}
.chip.berjalan{background:var(--amber);color:#2b1c00}
.chip.selesai{background:var(--ok-soft);color:var(--ok)}
.more{font-size:11px;color:var(--muted);padding-left:4px}

/* ===== Harga ===== */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.vcard{padding:18px;display:flex;flex-direction:column;gap:14px}
.vhead{display:flex;gap:12px;align-items:center}
.vhead h3{font-size:17px;line-height:1.2}
.vhead small{color:var(--muted)}
.prices div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.prices span{color:var(--muted)}
.prices b{font-variant-numeric:tabular-nums;text-align:right}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.vnext{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pk-price{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.pk-price small{font-family:var(--font);font-weight:500;color:var(--muted);font-size:13px}
.incl{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-size:13.5px}
.incl li{display:flex;gap:8px;align-items:flex-start}
.incl svg{color:var(--ok);flex:none;margin-top:3px}
.note{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--primary-soft);font-size:13.5px;display:flex;gap:10px}

/* ===== Keuangan ===== */
.mnav{display:inline-flex;align-items:center;gap:8px}
.mnav b{min-width:150px;text-align:center;font-family:var(--display);font-size:18px}
.txrow{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:11px 6px;border-bottom:1px solid var(--line)}
.txrow:last-child{border-bottom:0}
.txic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.txic.in{background:rgba(22,163,74,.14);color:var(--ok)}
.txic.out{background:rgba(220,38,38,.12);color:var(--bad)}
.txamt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.txbtns{display:flex;gap:2px}
.bars{display:grid;gap:12px}
.bar-r .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bar-r .t b{font-variant-numeric:tabular-nums}
.bar-r .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-r .b i{display:block;height:100%;border-radius:99px;background:var(--amber)}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.chart .c-in{fill:var(--primary)}
svg.chart .c-out{fill:var(--amber)}
svg.chart line{stroke:var(--line)}

/* ===== Forms & modal ===== */
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;margin-bottom:12px;min-width:0}
.fld input,.fld select,.fld textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:400;font-size:15px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:70px}
.fld small{color:var(--muted);font-weight:400}
.fld .mh{color:var(--primary);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600}
.chips button:hover{border-color:var(--primary);color:var(--primary)}
.warnbox{background:rgba(245,158,11,.16);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;margin-bottom:10px}
.chk input{width:18px;height:18px;accent-color:var(--primary)}
.ov{position:fixed;inset:0;background:rgba(8,16,15,.55);display:grid;place-items:center;padding:20px;z-index:100;overflow:auto}
.ov.cf{z-index:150}
.dlg{background:var(--surface);color:var(--ink);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dlg.wide{width:min(720px,100%)}
.dlg.sm{width:min(400px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 12px}
.dlg-h h3{font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.dlg-b{padding:4px 20px 18px;overflow:auto}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:12px 0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;word-break:break-word}
.moneybox{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.moneybox .r{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.moneybox .r b{font-variant-numeric:tabular-nums}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.mini-tx{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mini-tx:last-child{border-bottom:0}

/* ===== Settings ===== */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.set-card .card-b{padding-top:12px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.icons button{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icons button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input[type=color]{width:40px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
details.how{font-size:13.5px;margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
details.how summary{font-weight:700;cursor:pointer}
details.how ol{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
code{background:var(--primary-soft);padding:1px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.bad{background:#991b1b;color:#fff}
.toast.out{opacity:0;transition:opacity .35s}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Responsive ===== */
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.cols.even,.sgrid{grid-template-columns:1fr}}
@media (max-width:900px){
  .side{display:none}
  .wrap{margin-left:0}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:25}
  .mtop .brand{padding:0}
  .mtop .logo{width:36px;height:36px}
  .mtop .iconbtn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
  .main{padding:18px 16px 110px}
  .top h1{font-size:25px}
  .desk{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--muted);border-radius:10px}
  .bnav button.on{color:var(--primary);font-weight:700}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:0;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:29}
  #toasts{left:16px;bottom:calc(84px + env(safe-area-inset-bottom))}
  .hero{padding:22px 20px 30px}
  .hero h2{font-size:25px}
}

/* ===== Penyempurnaan tombol: modern, rapi, profesional ===== */
:root{--r-btn:12px;--ring:0 0 0 3px rgba(15,118,110,.22);--sh-1:0 1px 2px rgba(16,36,33,.06);--sh-2:0 6px 16px -4px rgba(15,118,110,.38);--ease:cubic-bezier(.2,.7,.2,1)}
.btn,.iconbtn,.tab,.seg button,.chips button,.dbtn,.tbtn,.nav button,.bnav button,.fab,.dtchips button{-webkit-appearance:none;appearance:none;transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease),filter .16s var(--ease)}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.chips button:focus-visible,.dbtn:focus-visible,.tbtn:focus-visible,.nav button:focus-visible,.bnav button:focus-visible,.fab:focus-visible,.dtchips button:focus-visible{outline:0;box-shadow:var(--ring)}
.btn:active,.iconbtn:active,.tab:active,.chips button:active,.fab:active{transform:scale(.97)}
.btn:disabled,.iconbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* Tombol utama */
.btn{min-height:40px;padding:9px 18px;border-radius:var(--r-btn);gap:8px;font-size:14px;font-weight:600;letter-spacing:.005em;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.btn svg{flex:none;width:17px;height:17px}
.btn:hover{background:#f6f9f8;border-color:#c3cfcb;box-shadow:0 2px 6px rgba(16,36,33,.08)}
.btn.primary{background:linear-gradient(180deg,#12877e 0%,var(--primary) 100%);border-color:#0c5f58;color:var(--on-primary);box-shadow:0 1px 2px rgba(8,60,55,.25),inset 0 1px 0 rgba(255,255,255,.16)}
.btn.primary:hover{filter:none;background:linear-gradient(180deg,#159a90 0%,#0f766e 100%);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.inv{box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn.inv:hover{background:#f1faf8;border-color:#f1faf8}
.btn.ghost-inv{box-shadow:none}
.btn.ghost-inv:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7)}
.btn.danger{background:#fff;color:var(--bad);border-color:rgba(185,28,28,.3)}
.btn.danger:hover{background:#fef2f2;border-color:rgba(185,28,28,.55)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13px;border-radius:10px;gap:6px}
.btn.sm svg{width:15px;height:15px}
.btn.block{width:100%}

/* Tombol ikon */
.iconbtn{width:40px;height:40px;border-radius:var(--r-btn);box-shadow:var(--sh-1);color:var(--ink)}
.iconbtn:hover{background:#f6f9f8;border-color:#c3cfcb}
.iconbtn.flat{box-shadow:none;border-color:transparent;background:transparent;color:var(--muted)}
.iconbtn.flat:hover{background:rgba(15,118,110,.09);color:var(--primary);border-color:transparent}
.txbtns{gap:4px;align-items:center}

/* Tab, segmen, dan chip filter */
.tabs{gap:8px;padding:2px 2px 6px}
.tab{min-height:38px;padding:7px 16px;border-radius:99px;box-shadow:var(--sh-1)}
.tab:hover{border-color:#c3cfcb;background:#f6f9f8}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px -3px rgba(20,33,31,.45)}
.tab.on:hover{background:var(--ink)}
.seg{padding:3px;gap:2px;border-radius:13px;background:#e7eeec;border-color:transparent}
.seg button{border-radius:10px;padding:7px 15px;min-height:34px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(16,36,33,.14)}
.chips{gap:8px}
.chips button{min-height:30px;padding:5px 13px;border-radius:99px}
.chips button:hover{background:var(--primary-soft)}
.dtchips button.on{box-shadow:0 3px 10px -3px rgba(15,118,110,.5)}

/* Navigasi samping */
.nav button{padding:11px 14px;border-radius:12px;gap:12px}
.nav button.on{box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}

/* Pemilih tanggal dan waktu */
.dbtn{border-radius:var(--r-btn);box-shadow:var(--sh-1)}
.tbtn{border-radius:var(--r-btn);box-shadow:var(--sh-1)}
.dp-g button.sel{box-shadow:0 3px 8px -2px rgba(15,118,110,.5)}

/* Tata letak kelompok tombol */
.top-actions{gap:10px}
.dlg-f{gap:10px;padding:14px 20px 16px;background:#fafcfb}
.dlg-f .btn{min-width:104px}

html,body{max-width:100%;overflow-x:hidden}

/* =========================================================
   Storage (window.storage -> localStorage -> memori)
========================================================= */
const KEY='rental-dashboard-v1';
const Store={
  mem:null,
  async load(){
    try{if(window.storage){const r=await window.storage.get(KEY,false);if(r&&r.value)return JSON.parse(r.value);}}catch(e){}
    try{const v=window.localStorage.getItem(KEY);if(v)return JSON.parse(v);}catch(e){}
    return this.mem;
  },
  save(data,silent){
    const s=JSON.stringify(data);this.mem=data;
    if(!silent&&typeof Sync!=='undefined'&&Sync)Sync.queue();
    try{if(window.storage){Promise.resolve(window.storage.set(KEY,s,false)).catch(()=>{});return;}}catch(e){}
    try{window.localStorage.setItem(KEY,s);}catch(e){}
  }
};

/* =========================================================
   Server online: sinkron data antar perangkat + cadangan
========================================================= */
var Sync={
  cfg:{url:'',key:'',ver:0,dirty:false,mode:'',etag:'',gh:{repo:'',token:'',path:'rental-data.json',branch:''}},
  style:'node',available:false,paused:false,state:'off',msg:'',inflight:false,pending:false,pushT:null,deferred:null,
  load(){try{Object.assign(this.cfg,JSON.parse(localStorage.getItem('rental-sync')||'{}'));}catch(e){}},
  persist(){try{localStorage.setItem('rental-sync',JSON.stringify(this.cfg));}catch(e){}},
  base(){const u=String(this.cfg.url||'').trim().replace(/\/+$/,'');if(u)return u;return /^https?:$/.test(location.protocol)?location.origin:'';},
  set(st,msg){
    this.state=st;this.msg=msg||'';
    const el=document.getElementById('sync-pill');if(el){const v=this.view();el.className='pill '+v[1];el.textContent=v[0];}
    const m=document.getElementById('sync-msg');if(m)m.textContent=this.msg;
  },
  view(){
    return ({ok:['Tersambung','ok'],busy:['Menyinkronkan','info'],off:['Tidak tersambung','mute'],'need-key':['Perlu kunci akses','warn'],paused:['Dijeda','warn'],error:['Gagal terhubung','bad']})[this.state]||['Tidak tersambung','mute'];
  },
  hasKey(){return this.style==='github'?!!(this.cfg.gh&&this.cfg.gh.token):!!this.cfg.key;},
  authFail(){
    if(this.style==='github'){this.cfg.gh.token='';this.persist();this.set('need-key','Token GitHub salah atau kedaluwarsa. Perbarui di Pengaturan > Penyimpanan online.');return;}
    this.cfg.key='';this.persist();this.set('need-key','Kunci akses salah.');this.prompt();
  },
  /* ---- Penyimpanan di repository GitHub (tanpa server) ---- */
  ghOn(){const g=this.cfg.gh;return this.cfg.mode==='github'&&!!(g&&g.repo&&g.token);},
  ghUrl(){const g=this.cfg.gh,pth=String(g.path||'rental-data.json').split('/').map(encodeURIComponent).join('/');return 'https://api.github.com/repos/'+g.repo+'/contents/'+pth+(g.branch?'?ref='+encodeURIComponent(g.branch):'');},
  ghHead(extra){return Object.assign({Authorization:'Bearer '+this.cfg.gh.token,Accept:'application/vnd.github+json'},extra||{});},
  async ghFetch(url,opt){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);try{return await fetch(url,Object.assign({cache:'no-store',signal:ctl.signal},opt));}finally{clearTimeout(to);}},
  b64dec(c){const bin=atob(String(c).replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0)));},
  b64enc(text){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.readAsDataURL(new Blob([text]));});},
  async ghGet(since,useEtag){
    const h=this.ghHead();
    if(useEtag&&this.cfg.etag&&String(since)===String(this.cfg.ver))h['If-None-Match']=this.cfg.etag;
    const r=await this.ghFetch(this.ghUrl(),{headers:h});
    if(r.status===304)return {status:200,body:{changed:false,version:this.cfg.ver}};
    if(r.status===401)return {status:401,body:{error:'Token GitHub salah atau kedaluwarsa.'}};
    if(r.status===404){
      const rr=await this.ghFetch('https://api.github.com/repos/'+this.cfg.gh.repo,{headers:this.ghHead()});
      if(rr.status===200)return {status:200,body:{changed:true,version:0,data:null}};
      return {status:404,body:{error:'Repository tidak ditemukan, atau token belum diberi akses ke repository ini.'}};
    }
    if(r.status===403||r.status===429)return {status:r.status,body:{error:'Akses ke GitHub ditolak atau dibatasi. Coba lagi beberapa menit lagi.'}};
    if(!r.ok)return {status:r.status,body:{error:'GitHub membalas kode '+r.status+'.'}};
    const j=await r.json();
    if(String(since)===String(j.sha)){this.cfg.etag=r.headers.get('ETag')||'';this.persist();return {status:200,body:{changed:false,version:j.sha}};}
    let text;
    if(j.encoding==='base64'&&j.content)text=this.b64dec(j.content);
    else{const rr=await this.ghFetch(this.ghUrl(),{headers:this.ghHead({Accept:'application/vnd.github.raw+json'})});text=await rr.text();}
    let data;try{data=JSON.parse(text);}catch(e){return {status:500,body:{error:'Isi file di GitHub bukan data yang valid.'}};}
    this.cfg.etag=r.headers.get('ETag')||'';
    return {status:200,body:{changed:true,version:j.sha,data:data}};
  },
  async ghPut(body){
    const g=this.cfg.gh;
    const payload={message:'Sinkron '+new Date().toLocaleString('id-ID'),content:await this.b64enc(JSON.stringify(body.data))};
    if(g.branch)payload.branch=g.branch;
    if(body.baseVersion)payload.sha=String(body.baseVersion);
    const r=await this.ghFetch(this.ghUrl().split('?')[0],{method:'PUT',headers:this.ghHead({'Content-Type':'application/json'}),body:JSON.stringify(payload)});
    if(r.status===200||r.status===201){const j=await r.json();this.cfg.etag='';return {status:200,body:{ok:true,version:j.content&&j.content.sha}};}
    if(r.status===401)return {status:401,body:{error:'Token GitHub salah atau kedaluwarsa.'}};
    if(r.status===409||r.status===422){
      const c=await this.ghGet(-1,false);
      if(c.status===200&&c.body.data)return {status:409,body:{error:'Data di GitHub lebih baru.',version:c.body.version,data:c.body.data}};
      return {status:r.status,body:{error:'Gagal menyimpan ke GitHub (kode '+r.status+').'}};
    }
    if(r.status===403||r.status===404)return {status:r.status,body:{error:r.status===404?'Repository tidak ditemukan atau token tidak punya izin menulis (Contents: Read and write).':'Akses ke GitHub ditolak atau dibatasi.'}};
    return {status:r.status,body:{error:'Gagal menyimpan ke GitHub (kode '+r.status+').'}};
  },
  url(base,path,style){return style==='php'?base+'/api.php?r='+path.slice(5).replace('?','&'):base+path;},
  async call(method,path,body){
    if(this.style==='github'){
      if(method==='GET'){const m=/since=([^&]*)/.exec(path);return this.ghGet(m?decodeURIComponent(m[1]):'-1',true);}
      return this.ghPut(body);
    }
    const base=this.base();if(!base)throw new Error('no-base');
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
    const php=this.style==='php';
    try{
      const r=await fetch(this.url(base,path,this.style),{method:(php&&method==='PUT')?'POST':method,headers:Object.assign({Authorization:'Bearer '+this.cfg.key,'X-Access-Key':this.cfg.key},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store',signal:ctl.signal});
      let j=null;try{j=await r.json();}catch(e){}
      return {status:r.status,body:j};
    }finally{clearTimeout(to);}
  },
  async detect(){
    this.available=false;
    if(this.ghOn()){this.style='github';this.available=true;return true;}
    if(this.style==='github')this.style='node';
    const base=this.base();if(!base)return false;
    for(const st of ['node','php']){
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),st==='node'?15000:8000);
      try{const r=await fetch(this.url(base,'/api/ping',st),{cache:'no-store',signal:ctl.signal});const j=await r.json();if(j&&j.app==='rental-sync'){this.available=true;this.style=st;break;}}
      catch(e){}
      finally{clearTimeout(to);}
    }
    return this.available;
  },
  async start(){
    this.load();
    if(!(await this.detect())){this.set('off','');return;}
    if(!this.hasKey()){this.set('need-key','Masukkan kunci akses server.');this.prompt();return;}
    await this.pull(true);
    clearInterval(this._poll);this._poll=setInterval(()=>this.pull(false),30000);
  },
  prompt(){
    if($('#modal-root').innerHTML)return;
    openModal({title:'Sambungkan ke server',body:`<p style="margin-bottom:12px">Data jadwal dan keuangan disimpan di server online. Masukkan kunci akses untuk melanjutkan.</p>${fld('Kunci akses','<input id="sync-key" type="password" autocomplete="off" placeholder="Kunci akses server">')}`,footer:`<button class="btn" data-act="close-modal">Nanti</button><button class="btn primary dlg-main" data-act="sync-connect">Sambungkan</button>`});
  },
  backupLocal(){try{localStorage.setItem(KEY+'-prev',JSON.stringify(DB));}catch(e){}},
  applyRemote(b){
    if($('#modal-root').innerHTML){this.deferred=b;return false;}
    this.deferred=null;this.backupLocal();
    DB=mergeDefaults(b.data);Store.save(DB,true);
    this.cfg.ver=b.version;this.cfg.dirty=false;this.persist();
    render();return true;
  },
  async pull(first){
    if(!this.available||!this.hasKey()||this.paused||this.inflight)return;
    if(this.deferred&&this.applyRemote(this.deferred)){this.set('ok');return;}
    if(this.cfg.dirty){await this.push();return;}
    let r;
    try{r=await this.call('GET','/api/data?since='+(first?0:this.cfg.ver));}
    catch(e){this.set('error','Tidak bisa terhubung ke server. Data tetap aman di perangkat ini.');return;}
    if(r.status===401){this.authFail();return;}
    if(r.status===429){this.set('error',(r.body&&r.body.error)||'Terlalu banyak percobaan.');return;}
    if(r.status!==200||!r.body){this.set('error',(r.body&&r.body.error)||'Server bermasalah (kode '+r.status+').');return;}
    const b=r.body;
    if(!b.changed){this.set('ok','Terakhir dicek '+fDT(new Date())+'.');return;}
    if(b.data==null){await this.push();return;}
    if(this.cfg.ver===0){
      const yes=await ask('Server sudah berisi data','Perangkat ini belum pernah disinkronkan. Pakai data dari server? Data di perangkat ini akan diganti (salinannya disimpan otomatis).','Pakai data server');
      if(!yes){this.paused=true;this.set('paused','Sinkron dijeda. Pilih "Unggah data perangkat ini" di Pengaturan bila ingin menimpa server.');return;}
    }
    if(this.applyRemote(b))this.set('ok','Data diperbarui dari server.');
  },
  queue(){
    if(!this.available||!this.hasKey()||this.paused)return;
    this.cfg.dirty=true;this.persist();
    clearTimeout(this.pushT);this.pushT=setTimeout(()=>this.push(),1200);
  },
  async push(){
    if(!this.available||!this.hasKey()||this.paused)return;
    if(this.inflight){this.pending=true;return;}
    this.inflight=true;this.set('busy','');
    try{
      const r=await this.call('PUT','/api/data',{data:DB,baseVersion:this.cfg.ver});
      if(r.status===200&&r.body){this.cfg.ver=r.body.version;this.cfg.dirty=false;this.persist();this.set('ok','Tersimpan di server '+fDT(new Date())+'.');}
      else if(r.status===409&&r.body&&r.body.data){this.set('ok','');if(this.applyRemote(r.body))toast('Data diperbarui dari perangkat lain.');}
      else if(r.status===401)this.authFail();
      else this.set('error',(r.body&&r.body.error)||'Gagal menyimpan ke server (kode '+r.status+').');
    }catch(e){this.set('error','Tidak bisa terhubung ke server. Perubahan akan dikirim saat tersambung kembali.');}
    finally{this.inflight=false;if(this.pending){this.pending=false;this.queue();}}
  }
};

function lum(c){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]);}
function mix(a,b,t){return a.map((v,i)=>Math.round(v*(1-t)+b[i]*t));}

/* ---------- Rincian biaya & laba unit Rental + driver ---------- */
const isDrvSvc=b=>b.service==='driver';
const outKey=t=>{const c=String(t.cat||'').trim().toLowerCase();return c==='premi driver'?'premi':/^(bbm|bensin|solar|pertamax|pertalite|dexlite)/.test(c)?'bbm':/^tol/.test(c)?'tol':'lain';};
function histAvg(b){
  const v=vehicle(b.vehicleId);
  const pool=DB.bookings.filter(x=>x.id!==b.id&&isDrvSvc(x)&&x.status==='selesai'&&(x.vehicleId===b.vehicleId||(v&&(vehicle(x.vehicleId)||{}).cat===v.cat)));
  const same=pool.filter(x=>x.vehicleId===b.vehicleId),use=same.length?same:pool;
  const ids=new Set(use.map(x=>x.id)),days=use.reduce((t,x)=>t+daysOf(x),0);
  if(!days)return{bbm:0,tol:0,n:0};
  let bbm=0,tol=0;
  DB.transactions.forEach(t=>{if(t.type!=='out'||!ids.has(t.bookingId))return;const k=outKey(t),m=Number(t.amount)||0;if(k==='bbm')bbm+=m;else if(k==='tol')tol+=m;});
  return{bbm:bbm/days,tol:tol/days,n:use.length};
}
const round1k=n=>Math.round((Number(n)||0)/1000)*1000;
function tripCalc(b){
  const days=daysOf(b),h=histAvg(b);
  const real={premi:0,bbm:0,tol:0,lain:0};
  DB.transactions.forEach(t=>{if(t.bookingId!==b.id||t.type!=='out'||t.auto==='net')return;real[outKey(t)]+=Number(t.amount)||0;});
  const nt=DB.transactions.find(t=>t.auto==='net'&&t.bookingId===b.id),booked=nt?(nt.type==='in'?1:-1)*(Number(nt.amount)||0):0;
  const premi=Number(b.premi)||0;
  const estBbm=Number(b.estBbm)>0?Number(b.estBbm):round1k(h.bbm*days);
  const estTol=Number(b.estTol)>0?Number(b.estTol):round1k(h.tol*days);
  const premiPlan=Math.max(premi,real.premi),bbmPlan=Math.max(estBbm,real.bbm),tolPlan=Math.max(estTol,real.tol);
  const total=Number(b.total)||0,paidIn=paid(b);
  const outReal=real.premi+real.bbm+real.tol,outPlan=premiPlan+bbmPlan+tolPlan;
  return{days:days,total:total,paidIn:paidIn,rest:Math.max(0,total-paidIn),real:real,premi:premi,premiRest:Math.max(0,premi-real.premi),
    estBbm:estBbm,estTol:estTol,premiPlan:premiPlan,bbmPlan:bbmPlan,tolPlan:tolPlan,outReal:outReal,outPlan:outPlan,
    netNow:paidIn-outReal,booked:booked,netFinal:total-outPlan,margin:total>0?Math.round((total-outPlan)/total*100):0,
    src:(Number(b.estBbm)>0||Number(b.estTol)>0)?'manual':h.n?'riwayat':'',hn:h.n};
}

/* ---------- Rental + driver: dana sewa bukan pemasukan, pemasukan = sisa bersih ---------- */
function syncNet(d){
  d=d||DB;if(!d||!Array.isArray(d.transactions))return;
  const bm=new Map(d.bookings.map(b=>[b.id,b])),acc={};
  d.transactions.forEach(t=>{
    if(t.auto==='net')return;
    const b=bm.get(t.bookingId);
    if(b&&isDrvSvc(b)&&(t.type==='in'||outKey(t)!=='lain')){t.hold=true;acc[b.id]=(acc[b.id]||0)+(t.type==='in'?1:-1)*(Number(t.amount)||0);}
    else delete t.hold;
  });
  const keep=[],olds={};
  d.transactions.forEach(t=>{if(t.auto==='net'&&bm.has(t.bookingId))olds[t.bookingId]=t;else keep.push(t);});
  d.bookings.forEach(b=>{
    if(!isDrvSvc(b)||b.status!=='selesai')return;
    const n=Math.round(acc[b.id]||0);if(!n)return;
    const o=olds[b.id];
    keep.push({id:o?o.id:uid('t'),date:o?o.date:(b.doneAt||toD(pd(b.end))),type:n>0?'in':'out',cat:n>0?'Pemasukan bersih sewa':'Kekurangan biaya sewa',amount:Math.abs(n),note:'Sisa bersih '+b.code,bookingId:b.id,auto:'net'});
  });
  d.transactions=keep;
}

function rel(b){
  const st=eff(b),n=Date.now(),s=pd(b.start).getTime(),e=pd(b.end).getTime();
  const fmt=ms=>{const m=Math.round(Math.abs(ms)/6e4);if(m<60)return m+' menit';const h=Math.round(m/60);if(h<48)return h+' jam';return Math.round(h/24)+' hari';};
  if(st==='terjadwal')return 'Mulai dalam '+fmt(s-n);
  if(st==='berjalan')return n<=e?'Selesai dalam '+fmt(e-n):'Lewat '+fmt(n-e)+' dari jadwal';
  return '';
}
function findConflicts(vehicleId,start,end,ignoreId){
  const s=pd(start),e=pd(end);

}

function chart6(){

function gantt(){
  const start=new Date();start.setHours(0,0,0,0);const N=14,end=new Date(start);end.setDate(end.getDate()+N);
  const head=Array.from({length:N},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return `<div class="g-day ${i===0?'today':''} ${d.getDay()===0||d.getDay()===6?'wk':''}"><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b></div>`;}).join('');
  const vs=DB.vehicles.filter(v=>v.status!=='nonaktif');

    const bs=DB.bookings.filter(b=>b.vehicleId===v.id&&b.status!=='batal'&&pd(b.end)>start&&pd(b.start)<end);

  return `<div class="g-scroll"><div class="gantt"><div class="g-row g-headrow"><div class="g-name"></div><div class="g-days">${head}</div></div>${rows}</div></div>`;
}

/* ---------- Statistik armada & jam ---------- */
const FLEET=[['Innova Reborn',/innova/i],['Xenia',/xenia/i]];
function fleetStats(a,z){
  return FLEET.map(f=>{
    const vs=DB.vehicles.filter(v=>f[1].test(v.name)),ids=vs.map(v=>v.id);let inc=0,out=0;
    DB.transactions.forEach(t=>{const b=getB(t.bookingId),d=pd(t.date);if(!b||t.hold||b.status==='batal'||!ids.includes(b.vehicleId)||!(d>=a&&d<z))return;const m=Number(t.amount)||0;if(t.type==='in')inc+=m;else out+=m;});
    const tr=DB.bookings.filter(b=>b.status!=='batal'&&ids.includes(b.vehicleId)&&pd(b.start)>=a&&pd(b.start)<z);
    const sch={terjadwal:0,berjalan:0,selesai:0};tr.forEach(b=>{sch[eff(b)]++;});return{name:f[0],v:vs[0],inc:inc,out:out,net:inc-out,trips:tr.length,days:tr.reduce((s,b)=>s+daysOf(b),0),sch:sch};
  });
}
function statMonths(n){
  const now=new Date(),r=[];
  for(let i=n-1;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1),z=new Date(a.getFullYear(),a.getMonth()+1,1);r.push({a:a,l:MON[a.getMonth()]+' '+a.getFullYear(),f:fleetStats(a,z),tin:sumT('in',a,z),tout:sumT('out',a,z)});}
  return r;
}
function fleetSched(a,z){
  const lbl=b=>overdue(b)?'Perlu diselesaikan':({terjadwal:'Akan mulai',berjalan:'Berjalan',selesai:'Selesai'}[eff(b)]||'-'),rows=[];
  FLEET.forEach(f=>{const ids=DB.vehicles.filter(v=>f[1].test(v.name)).map(v=>v.id);
    DB.bookings.filter(b=>b.status!=='batal'&&ids.includes(b.vehicleId)&&pd(b.start)>=a&&pd(b.start)<z).sort((x,y)=>pd(x.start)-pd(y.start)).forEach(b=>{const p=paid(b);rows.push([f[0],b.code,b.customer,SERVICE[b.service]||'-',fDate(pd(b.start)),fDate(pd(b.end)),daysOf(b),lbl(b),b.total,p,Math.max(0,b.total-p),b.id]);});});
  return rows;
}
function schedHtml(a,z,now){

function vJadwal(){
  const all=DB.bookings;
  const groups={upcoming:all.filter(b=>eff(b)==='terjadwal'),running:all.filter(b=>eff(b)==='berjalan'),done:all.filter(b=>b.status==='selesai'),cancel:all.filter(b=>b.status==='batal'),all:all};
  const tabs=[['upcoming','Akan mulai'],['running','Berjalan'],['done','Selesai'],['cancel','Dibatalkan'],['all','Semua']];
  const q=state.q.trim().toLowerCase();
  let list=groups[state.jTab]||[];
  if(q)list=list.filter(b=>{const v=vehicle(b.vehicleId);return [b.customer,b.code,b.pickup,b.dest,b.driver,v&&v.name,v&&v.plate].join(' ').toLowerCase().includes(q);});
  list=list.slice().sort((a,b)=>state.jTab==='upcoming'||state.jTab==='running'?pd(a.start)-pd(b.start):pd(b.start)-pd(a.start));
  const toolbar=`<div class="toolbar"><div class="search">${icon('search',17)}<input id="q" type="search" placeholder="Cari pelanggan, kode, tujuan, plat..." value="${esc(state.q)}" aria-label="Cari jadwal"></div>
    <div class="seg"><button class="${state.jView==='list'?'on':''}" data-act="jview" data-v="list">${icon('list',16)} Daftar</button><button class="${state.jView==='cal'?'on':''}" data-act="jview" data-v="cal">${icon('calendar',16)} Kalender</button></div></div>`;

    <div class="card"><div class="card-b" style="padding-top:10px"><div class="blist">${list.length?list.map(bookingRow).join(''):empty('calendar',q?'Tidak ada jadwal yang cocok dengan pencarian.':'Belum ada jadwal pada kategori ini.',`<button class="btn primary sm" data-act="new-booking">Buat booking</button>`)}</div></div></div>`;
  return head('Jadwal','Pantau jadwal yang akan mulai, sedang berjalan, dan sudah selesai.',`<button class="btn" data-act="ics-all">${icon('download',16)} Google Calendar</button><button class="btn primary" data-act="new-booking">${icon('plus',16)} Booking baru</button>`)+toolbar+body;
}
function calView(compact){
  const m=state.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const off=(new Date(y,mo,1).getDay()+6)%7,startD=new Date(y,mo,1-off),today=toD(new Date());
  let cells=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dh">${d}</div>`).join('');
  const nCells=compact?Math.ceil((off+new Date(y,mo+1,0).getDate())/7)*7:42;
  for(let i=0;i<nCells;i++){
    const d=new Date(startD.getFullYear(),startD.getMonth(),startD.getDate()+i),ds=toD(d),e0=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    const list=DB.bookings.filter(b=>b.status!=='batal'&&pd(b.start)<e0&&pd(b.end)>=d).sort((a,b)=>pd(a.start)-pd(b.start));
    const chips=list.slice(0,3).map(b=>{const v=vehicle(b.vehicleId);return `<button class="chip ${eff(b)}" data-act="view-booking" data-id="${b.id}" title="${esc(b.customer)}">${esc(b.customer)}${v?' ('+esc(v.name)+')':''}</button>`;}).join('');
    cells+=`<div class="cc ${d.getMonth()!==mo?'out':''} ${ds===today?'today':''}" data-act="new-booking" data-date="${ds}"><span class="cn">${d.getDate()}</span>${chips}${list.length>3?`<span class="more">+${list.length-3} lagi</span>`:''}</div>`;
  }
  return `<div class="toolbar"><div class="mnav"><button class="iconbtn" data-act="cal-prev" aria-label="Bulan sebelumnya">${icon('chevL')}</button><b>${MONTHS[mo]} ${y}</b><button class="iconbtn" data-act="cal-next" aria-label="Bulan berikutnya">${icon('chevR')}</button></div><button class="btn sm" data-act="cal-today">Bulan ini</button></div><div class="cal${compact?' sm':''}">${cells}</div>
  ${compact?'':'<p class="mute" style="margin-top:10px;font-size:13px">Ketuk tanggal untuk membuat booking di hari itu.</p>'}`;
}

   Form: Booking
========================================================= */
function bookingForm(id,preset){
  preset=preset||{};
  const edit=id?getB(id):null;
  const day=preset.date||toD(new Date(Date.now()+864e5));
  const b=edit||{customer:'',phone:'',service:preset.service||'driver',vehicleId:preset.vehicleId||((DB.vehicles.find(v=>v.status==='aktif')||{}).id||''),packageId:preset.packageId||(DB.packages[0]||{}).id||'',start:day+'T07:00',end:day+'T19:00',pickup:'',dest:'',driver:'',pax:preset.service==='paket'?10:'',total:'',note:''};
  const vopts=DB.vehicles.filter(v=>v.status==='aktif'||v.id===b.vehicleId).map(v=>[v.id,`${v.name} (${v.plate||'tanpa plat'})`]);
  const body=`<div id="bf">
    <div class="grid2">${fld('Nama pelanggan *',inp('customer',b.customer,'placeholder="Nama pelanggan / instansi" autocomplete="off"'))}${fld('No. WhatsApp',inp('phone',b.phone,'type="tel" placeholder="08xxxxxxxxxx"'))}</div>
    <div class="grid2">${fld('Layanan',sel('service',Object.entries(SERVICE),b.service))}${fld('Armada *',vopts.length?sel('vehicleId',vopts,b.vehicleId):'<select name="vehicleId"><option value="">Belum ada armada</option></select>')}</div>
    <div class="grid2" id="pkrow"><div id="pkfld">${fld('Paket liburan',sel('packageId',DB.packages.map(p=>[p.id,`${p.name} (${rp(p.price)}/org)`]),b.packageId))}</div><div id="paxfld">${fld('Jumlah penumpang',inp('pax',b.pax,'type="number" min="0" inputmode="numeric"'))}</div></div>
    <div class="grid2">${dtField('Tanggal & jam berangkat *','start',b.start)}${dtField('Tanggal & jam selesai *','end',b.end)}</div>
    <div id="dsum" class="dsum"></div>
    <div id="cw"></div>
    <div class="grid2" id="routebox">${fld('Titik jemput',inp('pickup',b.pickup,'placeholder="Alamat jemput"'))}${fld('Tujuan',inp('dest',b.dest,'placeholder="Kota / lokasi tujuan"'))}</div>
    <div id="drvbox" class="grid2">${fld('Nama driver',sel('driver',[['','Pilih driver']].concat(drvNames(b.driver).map(n=>[n,n])),b.driver))}${fld('Premi driver (Rp)',money('premi',b.premi||''),'Terisi otomatis dari premi per hari driver.')}</div>
    <div id="estbox" class="grid2">${fld('Estimasi BBM (Rp)',money('estBbm',b.estBbm||''),'<span id="hbbm"></span>')}${fld('Estimasi tol (Rp)',money('estTol',b.estTol||''),'<span id="htol"></span>')}</div>
    <div id="pbox" class="dsum estbox-sum"></div>
    ${fld('Total harga (Rp)',money('total',b.total===0?'':b.total),'<span id="est"></span>')}
    ${edit?'':fld('Pembayaran awal / DP (Rp)',money('dp',''),'Rental + driver: dicatat sebagai dana sewa (bukan pemasukan). Layanan lain: dicatat sebagai pemasukan.')}
    ${fld('Catatan',`<textarea name="note" rows="2" placeholder="Permintaan khusus, rute, jam jemput, dll.">${esc(b.note)}</textarea>`)}</div>`;
  openModal({title:edit?'Ubah booking':'Booking baru',wide:true,body:body,
    footer:`<button class="btn" data-act="close-modal">Batal</button><button class="btn primary" data-act="save-booking" data-id="${edit?edit.id:''}">${icon('check',16)} Simpan booking</button>`,
    onMount:dlg=>{
      const root=$('#bf',dlg);let dirty=!!edit&&b.total>0,pdirty=!!edit&&Number(b.premi)>0;const ed={bbm:!!edit&&Number(b.estBbm)>0,tol:!!edit&&Number(b.estTol)>0};
      const g=n=>$(`[name="${n}"]`,root);
      const pbox=()=>{
        const el=$('#pbox',root);if(!el)return;
        const f=readForm(root);
        if(f.service!=='driver'){el.innerHTML='';return;}
        const tot=Number(f.total)||0,pr=f.driver?(Number(f.premi)||0):0,bb=Number(f.estBbm)||0,tl=Number(f.estTol)||0,out=pr+bb+tl,net=tot-out,mg=tot>0?Math.round(net/tot*100):0;
        el.innerHTML=`<div>Premi driver <b>${rp(pr)}</b> + BBM <b>${rp(bb)}</b> + tol <b>${rp(tl)}</b> = <b>${rp(out)}</b></div><div>Estimasi pemasukan bersih: <b class="${net<0?'neg':''}">${rp(net)}</b>${tot>0?` <span>(${mg}% dari total harga)</span>`:''}</div>`;
      };
      let prev={s:NaN,e:NaN};
      const gs=()=>pd($('input[name]',$('.dtf[data-dt="start"]',root)).value),ge=()=>pd($('input[name]',$('.dtf[data-dt="end"]',root)).value);
      const shiftEnd=()=>{
        const s=gs();if(isNaN(s))return;
        const keep=(!isNaN(prev.s)&&!isNaN(prev.e)&&prev.e>prev.s)?prev.e-prev.s:12*36e5;
        dtSet($('.dtf[data-dt="end"]',root),toDT(new Date(s.getTime()+keep)));
      };
      const sync=()=>{
        const f=readForm(root);
        $('#pkfld',root).style.display=f.service==='paket'?'':'none';$('#pkrow',root).style.display=f.service==='self'?'none':'';$('#routebox',root).style.display=f.service==='self'?'none':'';$('#drvbox',root).style.display=needDrv(f.service)?'':'none';
        const v=vehicle(f.vehicleId),days=daysOf(f),total=calcTotal(f);
        let est='';
        if(f.service==='paket'){const p=DB.packages.find(x=>x.id===f.packageId);est=p?`${f.pax||0} orang x ${rp(p.price)} = ${rp(total)}`:'Pilih paket liburan.';}
        else if(v){const u=f.service==='self'?v.priceSelf:f.service==='out'?v.priceOut:v.priceDriver;est=u>0?`Estimasi: ${days} hari x ${rp(u)} = ${rp(total)}`:'Layanan ini tidak tersedia untuk armada terpilih. Isi total manual.';}
        $('#est',root).textContent=est;$('#dsum',root).innerHTML=dtSummary(f);
        if(!dirty){g('total').value=total>0?total:'';const h=g('total').parentNode.querySelector('.mh');if(h)h.textContent=total>0?rp(total):'';}
        if(!pdirty){const dv=DB.drivers.find(x=>x.name===f.driver),pv=dv&&dv.premi>0?dv.premi*days:'';g('premi').value=pv;const h2=g('premi').parentNode.querySelector('.mh');if(h2)h2.textContent=pv?rp(pv):'';}
        const cf=f.vehicleId&&f.start&&f.end?findConflicts(f.vehicleId,f.start,f.end,edit?edit.id:''):[];
        $('#cw',root).innerHTML=cf.length?`<div class="warnbox">${icon('alert',18)}<span>Armada ini sudah dipakai pada waktu tersebut oleh ${cf.map(x=>esc(x.customer)).join(', ')}.</span></div>`:'';
        const isD=f.service==='driver',eb=$('#estbox',root),pb=$('#pbox',root);
        if(eb)eb.style.display=isD?'':'none';if(pb)pb.style.display=isD?'':'none';
        if(isD){
          const h=histAvg(f),setE=(nm,val,flag,hid)=>{const el=g(nm);if(!flag){el.value=val>0?val:'';const mh=el.parentNode.querySelector('.mh');if(mh)mh.textContent=val>0?rp(val):'';}const hn=$(hid,root);if(hn)hn.textContent=flag?'Diisi manual.':(h.n?`Rata-rata ${h.n} sewa selesai x ${days} hari.`:'Belum ada riwayat, isi manual.');};
          setE('estBbm',round1k(h.bbm*days),ed.bbm,'#hbbm');setE('estTol',round1k(h.tol*days),ed.tol,'#htol');
        }
        pbox();
        prev={s:gs(),e:ge()};
      };
      const onDT=ev=>{const w=ev.target.closest&&ev.target.closest('.dtf');if(!w)return;dtCompose(w);if(w.dataset.dt==='start')shiftEnd();};
      root.addEventListener('click',ev=>{
        const t=ev.target.closest&&ev.target.closest('.dbtn,[data-step],[data-q]');if(!t)return;
        ev.preventDefault();
        const w=t.closest('.dtf'),isStart=!!w&&w.dataset.dt==='start';
        if(t.classList.contains('dbtn')){
          openDatePicker($('[data-p="d"]',w).value,ds=>{dtSetDate(w,ds);if(isStart)shiftEnd();sync();});
          return;
        }
        if(t.dataset.step){
          const cur=pd($('input[name]',w).value);
          if(isNaN(cur)){toast('Pilih tanggal dulu.','bad');return;}
          dtSet(w,toDT(new Date(cur.getTime()+Number(t.dataset.step)*60000)));
          if(isStart)shiftEnd();
          sync();return;
        }
        const ws=$('.dtf[data-dt="start"]',root),we=$('.dtf[data-dt="end"]',root);
        const q=t.dataset.q,v=t.dataset.v;
        if(q==='date'){const d=new Date();d.setDate(d.getDate()+Number(v));dtSetDate(ws,toD(d));shiftEnd();}
        else if(q==='time'){
          if(!$('[data-p="d"]',ws).value){toast('Pilih tanggal berangkat dulu.','bad');return;}
          dtSetTime(ws,v);shiftEnd();
        }else if(q==='dur'){
          const s=gs();
          if(isNaN(s)){toast('Pilih tanggal & jam berangkat dulu.','bad');return;}
          dtSet(we,toDT(new Date(s.getTime()+Number(v)*36e5)));
        }
        sync();
      });
      root.addEventListener('input',ev=>{const n=ev.target.name;if(n==='premi'){pdirty=ev.target.value!=='';pbox();return;}if(n==='total'){dirty=ev.target.value!=='';pbox();return;}if(n==='estBbm'){ed.bbm=ev.target.value!=='';pbox();return;}if(n==='estTol'){ed.tol=ev.target.value!=='';pbox();return;}onDT(ev);sync();});
      root.addEventListener('change',ev=>{if(ev.target.name==='driver')pdirty=false;if(!['total','premi','estBbm','estTol'].includes(ev.target.name)){onDT(ev);sync();}});
      sync();
      const first=g('customer');if(first&&!edit&&window.innerWidth>700)first.focus();
    }});
}
async function saveBooking(id){
  const root=$('#bf');if(!root)return;
  const f=readForm(root),edit=id?getB(id):null;
  const bad=(n,m)=>{toast(m,'bad');let el=$(`[name="${n}"]`,root);if(el&&el.type==='hidden'){const w=el.closest('.dtf');el=w&&$('.dbtn',w);}if(el){try{el.scrollIntoView({block:'center',behavior:'smooth'});el.focus({preventScroll:true});}catch(e){}}};
  if(!f.customer)return bad('customer','Nama pelanggan wajib diisi.');
  if(!f.vehicleId)return bad('vehicleId','Pilih armada terlebih dulu. Tambahkan armada di menu Harga & Armada.');
  if(!f.start||!f.end||isNaN(pd(f.start))||isNaN(pd(f.end)))return bad(!f.start||isNaN(pd(f.start))?'start':'end','Tanggal dan jam berangkat/selesai wajib diisi.');
  if(pd(f.end)<=pd(f.start))return bad('end','Waktu selesai harus setelah jam berangkat.');
  if(f.service==='paket'&&!f.packageId)return bad('packageId','Pilih paket liburan.');
  const total=Number(f.total)||0;
  const cf=findConflicts(f.vehicleId,f.start,f.end,edit?edit.id:'');
  if(cf.length){const ok=await ask('Jadwal bentrok',`Armada sudah dipakai oleh ${cf.map(x=>x.customer).join(', ')} pada waktu tersebut. Tetap simpan?`,'Tetap simpan');if(!ok)return;}
  let b;
  const data={customer:f.customer,phone:f.phone,service:f.service,vehicleId:f.vehicleId,packageId:f.service==='paket'?f.packageId:'',start:f.start,end:f.end,pickup:f.service==='self'?'':f.pickup,dest:f.service==='self'?'':f.dest,driver:needDrv(f.service)?f.driver:'',premi:needDrv(f.service)&&f.driver?(Number(f.premi)||0):0,estBbm:f.service==='driver'?(Number(f.estBbm)||0):0,estTol:f.service==='driver'?(Number(f.estTol)||0):0,pax:f.service==='self'||f.pax===''?0:f.pax,total:total,note:f.note};
  if(edit){Object.assign(edit,data);b=edit;}
  else{
    b=Object.assign({id:uid('b'),code:genCode(),status:'aktif',gcalId:''},data);
    DB.bookings.push(b);
    const dp=Number(f.dp)||0;
    if(dp>0)DB.transactions.push({id:uid('t'),date:toD(new Date()),type:'in',cat:'DP sewa',amount:dp,note:'DP '+b.code,bookingId:b.id});
  }
  save();closeModal();render();toast(edit?'Booking diperbarui.':'Booking tersimpan.');
  viewBooking(b.id);
}

/* =========================================================

function txForm(id,preset){
  preset=preset||{};
  const t=id?DB.transactions.find(x=>x.id===id):null;
  const d=t||{type:preset.type||'out',date:toD(new Date()),cat:preset.cat||'',amount:preset.amount||'',note:'',bookingId:preset.bookingId||''};
  if(!d.cat)d.cat=d.type==='in'?'Pembayaran sewa':'BBM';
  const bopts=[['','Tanpa jadwal']].concat(DB.bookings.slice().sort((a,b)=>pd(b.start)-pd(a.start)).map(b=>[b.id,`${b.code}, ${b.customer}`]));
  const body=`<div id="tf">
    <div class="grid2">${fld('Jenis',sel('type',[['in','Pemasukan'],['out','Pengeluaran']],d.type))}${fld('Tanggal',inp('date',d.date,'type="date"'))}</div>
    ${fld('Kategori',`<input name="cat" list="catlist" value="${esc(d.cat)}" autocomplete="off"><datalist id="catlist"></datalist>`)}
    <div class="chips" id="chips"></div>
    <div class="grid2">${fld('Jumlah (Rp) *',money('amount',d.amount))}${fld('Terkait jadwal',sel('bookingId',bopts,d.bookingId))}</div>
    <p id="txhint" class="tripnote" style="display:none"></p>
    ${fld('Catatan',inp('note',d.note,'placeholder="Contoh: BBM Pertamax 40 liter"'))}</div>`;
  openModal({title:t?'Ubah transaksi':(d.type==='in'?'Catat pemasukan':'Catat pengeluaran'),body:body,
    footer:`<button class="btn" data-act="close-modal">Batal</button><button class="btn primary" data-act="save-tx" data-id="${t?t.id:''}" data-back="${preset.back?1:''}">${icon('check',16)} Simpan</button>`,
    onMount:dlg=>{
      const root=$('#tf',dlg);

function icsFor(list){

    DB.packages.forEach(p=>{t+=`*${p.name}* (${p.days}H${p.nights}M)\n${p.dest}\n- Harga: ${rp(p.price)}/orang (min ${p.minPax} orang)\n`;(p.includes||[]).forEach(i=>{t+=`  . ${i}\n`;});if(p.note)t+=`  Catatan: ${p.note}\n`;t+='\n';});
  }
  return t+s.priceNote+`\n\nInfo & pemesanan: ${s.phone}`;
}
async function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
}

async function pushNotif(title,body,tag){
  DB.notifLog.unshift({id:uid('n'),t:Date.now(),title:title,body:body,read:false});
  DB.notifLog=DB.notifLog.slice(0,60);save();updateBadge();toast(title);
  if('Notification' in window&&Notification.permission==='granted'){
    try{
      const reg=navigator.serviceWorker&&navigator.serviceWorker.getRegistration?await navigator.serviceWorker.getRegistration():null;
      if(reg){await reg.showNotification(title,{body:body,tag:tag||'rental',vibrate:[200,100,200],renotify:true,requireInteraction:false,data:{bookingId:String(tag||'').split(':')[1]?String(tag).split(':')[0]:''}});return;}
    }catch(e){}
    try{new Notification(title,{body:body,tag:tag||'rental'});}catch(e){}
  }
}
function notifActive(){return !!(DB&&DB.settings.notif.enabled&&'Notification' in window&&Notification.permission==='granted');}
function notifBanner(){
  if(!DB||notifActive()||!('Notification' in window))return '';
  if(Notification.permission==='denied')return `<div class="note" style="margin:0 0 16px">${icon('bell',18)}<div>Notifikasi jadwal diblokir di browser. Buka pengaturan situs di Chrome, izinkan notifikasi, lalu muat ulang halaman ini.</div></div>`;
  return `<div class="note" style="margin:0 0 16px;align-items:center;flex-wrap:wrap">${icon('bell',18)}<div style="flex:1 1 200px">Aktifkan notifikasi supaya jadwal yang akan mulai diingatkan di Android.</div><button class="btn primary sm" data-act="notif-enable">Aktifkan notifikasi</button></div>`;
}
function tick(){
  if(!DB||!DB.settings.notif.enabled)return;
  const now=Date.now();let changed=false;
  DB.bookings.forEach(b=>{
    if(b.status!=='aktif')return;
    const st=pd(b.start).getTime(),en=pd(b.end).getTime(),v=vehicle(b.vehicleId);
    if(isNaN(st))return;
    LEADS.forEach(l=>{
      if(!DB.settings.notif.leads.includes(l[0]))return;
      const key=b.id+':'+l[0];if(DB.notified[key])return;
      const at=st-l[2]*6e4,ok=l[2]>0?(now>=at&&now<st):(now>=st&&now<st+2*36e5);
      if(!ok)return;
      DB.notified[key]=1;changed=true;
      const label=l[0]==='d1'?'besok':l[0]==='h3'?'3 jam lagi':'sekarang';
      pushNotif(`Jadwal ${label}: ${b.customer}`,`${v?v.name:'Armada'}, ${fDT(pd(b.start))}${b.pickup?', jemput '+b.pickup:''}`,key);
    });
    const ok2=b.id+':over';
    if(now>en&&now<en+7*864e5&&!DB.notified[ok2]){DB.notified[ok2]=1;changed=true;pushNotif(`Jadwal ${b.customer} sudah lewat`,'Tandai selesai dan cek pelunasan.',ok2);}
  });
  if(changed)save();
}
function bellModal(){
  const L=DB.notifLog;
  openModal({title:'Notifikasi',body:L.length?L.map(n=>`<div class="mini-tx" style="align-items:flex-start"><span><b>${esc(n.title)}</b><br><small class="mute">${esc(n.body)}</small></span><small class="mute" style="white-space:nowrap">${fDT(new Date(n.t))}</small></div>`).join(''):empty('bell','Belum ada notifikasi. Aktifkan pengingat di Pengaturan.'),
    footer:L.length?`<button class="btn" data-act="notif-clear">Kosongkan</button><button class="btn primary" data-act="close-modal">Tutup</button>`:''});
  DB.notifLog.forEach(n=>n.read=true);save();updateBadge();
}

  ev.preventDefault();
  try{const r=fn(el.dataset,el,ev);if(r&&r.catch)r.catch(e=>toast(e&&e.message?e.message:'Terjadi kesalahan.','bad'));}
  catch(e){toast(e&&e.message?e.message:'Terjadi kesalahan.','bad');}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('#dp-root').innerHTML){$('#dp-root').innerHTML='';$('#dp-root').onclick=null;return;}if($('#confirm-root').innerHTML){$('#confirm-root').innerHTML='';return;}closeModal();return;}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.brow[role="button"]')){ev.preventDefault();ev.target.click();}
});
function keepFocus(id){
  const el=$('#'+id),pos=el?el.selectionStart:0;
  render();
  const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){state.q=t.value;keepFocus('q');return;}
  if(t.id==='fq'){state.fq=t.value;keepFocus('fq');return;}
  if(t.dataset&&t.dataset.money!==undefined){const h=t.parentNode.querySelector('.mh');if(h)h.textContent=t.value!==''?rp(t.value):'';}
  if(t.dataset&&(t.dataset.set==='primary'||t.dataset.set==='bg')){setPath(t.dataset.set,t.value);applyTheme();saveSoon();}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='imp'){
    const file=t.files&&t.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.bookings)||!Array.isArray(d.vehicles))throw new Error('x');DB=mergeDefaults(d);save();render();toast('Cadangan berhasil dipulihkan.');}catch(e){toast('File cadangan tidak valid.','bad');}};
    rd.readAsText(file);t.value='';return;
  }
  if(t.dataset&&t.dataset.lead){
    const L=DB.settings.notif.leads,k=t.dataset.lead;
    DB.settings.notif.leads=t.checked?Array.from(new Set(L.concat(k))):L.filter(x=>x!==k);save();return;
  }
  if(t.dataset&&t.dataset.set){
    const path=t.dataset.set,val=t.type==='checkbox'?t.checked:t.value;
    setPath(path,val);save();
    if(path==='notif.enabled'&&val&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}toast('Pengingat jadwal aktif.');tick();}
    render();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();Sync.pull(false);}});
if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{const m=e.data||{};if(m.type==='open-booking'&&getB(m.id))viewBooking(m.id);});}

/* =========================================================
   Mulai
========================================================= */
(async function init(){
  let d=null;
  try{d=await Store.load();}catch(e){}
  DB=(d&&Array.isArray(d.vehicles)&&Array.isArray(d.bookings))?mergeDefaults(d):seed();
  save();render();registerSW();Sync.start();
  try{const q=new URLSearchParams(location.search).get('booking');if(q&&getB(q))setTimeout(()=>viewBooking(q),400);}catch(e){}
  setInterval(tick,30000);setTimeout(tick,2500);
  setInterval(()=>{if(state.view==='dashboard'&&!$('#modal-root').innerHTML&&document.activeElement===document.body)render();},60000);
})();
</script>
</body>
</html>
