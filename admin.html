<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Dashboard Rental & Charter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0f766e;--on-primary:#ffffff;--primary-soft:#dff1ee;
  --bg:#eef2f0;--surface:#ffffff;--ink:#14211f;--muted:#5d6b68;--line:#dbe3e0;--side:#0b2e2b;
  --amber:#f59e0b;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;--ok-soft:rgba(22,163,74,.16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
small{font-size:12.5px}
.mute{color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* ===== Shell ===== */
.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--side);color:#e8f1ef;display:flex;flex-direction:column;padding:20px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 24px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.2)}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand small{opacity:.65}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;padding:11px 12px;border-radius:10px;text-align:left;opacity:.8;width:100%;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button.on{background:var(--primary);color:var(--on-primary);opacity:1;font-weight:700}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.75)}
.side-foot b{color:#fff;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.wrap{margin-left:252px}
.mtop{display:none}
.main{padding:28px 36px 60px;max-width:1320px;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:30px;letter-spacing:-.02em;line-height:1.1}
.top p{color:var(--muted);margin-top:5px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bnav{display:none}
.fab{display:none}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.inv{background:var(--on-primary);border-color:var(--on-primary);color:var(--primary)}
.btn.ghost-inv{background:transparent;border-color:rgba(255,255,255,.45);color:inherit}
.btn.danger{color:var(--bad);border-color:rgba(185,28,28,.35)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;position:relative;flex:none}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn.flat{border-color:transparent;background:transparent}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 6px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.card-b{padding:6px 18px 18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:rgba(22,163,74,.14);color:var(--ok)}
.pill.warn{background:rgba(245,158,11,.18);color:var(--warn)}
.pill.bad{background:rgba(220,38,38,.14);color:var(--bad)}
.pill.info{background:rgba(37,99,235,.13);color:var(--info)}
.pill.mute{background:var(--line);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;white-space:nowrap;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab i{font-style:normal;font-size:12px;opacity:.7}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;min-width:220px;flex:1;max-width:360px}
.search input{border:0;background:none;outline:0;padding:10px 0;width:100%;font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 13px;display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--primary);color:var(--on-primary)}

/* ===== Dashboard ===== */
.hero{background:var(--primary);color:var(--on-primary);border-radius:20px;padding:28px 30px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:30px;right:30px;bottom:14px;height:3px;background:repeating-linear-gradient(90deg,currentColor 0 22px,transparent 22px 44px);opacity:.28;border-radius:3px}
.hero h2{font-family:var(--display);font-size:30px;letter-spacing:-.02em;line-height:1.1}
.hero p{margin-top:8px;opacity:.9;max-width:560px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat .lbl{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
.stat small{display:inline-flex;gap:4px;align-items:center}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
.cols.even{grid-template-columns:1fr 1fr}
.g-scroll{overflow-x:auto;padding:0 18px 14px}
.gantt{min-width:820px}
.g-row{display:grid;grid-template-columns:176px 1fr;align-items:stretch;border-top:1px solid var(--line)}
.g-headrow{border-top:0}
.g-days{display:grid;grid-template-columns:repeat(14,1fr)}
.g-day{display:flex;flex-direction:column;align-items:center;padding:6px 0;font-size:11px;color:var(--muted);border-left:1px solid var(--line)}
.g-day b{font-size:14px;color:var(--ink)}
.g-day.today{background:var(--primary-soft);border-radius:8px 8px 0 0}
.g-day.wk span{color:var(--bad)}
.g-name{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 0;min-width:0}
.g-name .vic{width:34px;height:34px;border-radius:9px}
.g-name b{display:block;font-size:13.5px;line-height:1.2}
.g-name small{color:var(--muted)}
.g-track{position:relative;min-height:52px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/14) 100%}
.g-track::before{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(100%/14);background:var(--primary-soft);opacity:.6}
.g-track.svc{background-color:rgba(245,158,11,.08)}
.g-bar{position:absolute;top:9px;bottom:9px;border:0;border-radius:8px;padding:0 8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:700;z-index:1;text-align:left}
.g-bar span{overflow:hidden;text-overflow:ellipsis}
.g-bar.terjadwal{background:var(--primary);color:var(--on-primary)}
.g-bar.berjalan{background:var(--amber);color:#2b1c00}
.g-bar.selesai{background:var(--ok-soft);color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.vic{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}

/* ===== Booking rows ===== */
.blist{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:12px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--primary-soft)}
.bdate{text-align:center;background:var(--primary-soft);border-radius:10px;padding:7px 0;line-height:1.1}
.brow:hover .bdate{background:var(--surface)}
.bdate b{font-family:var(--display);font-size:20px;display:block}
.bdate span{font-size:11px;color:var(--muted)}
.btitle{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bmeta{display:flex;gap:2px 14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:3px}
.mi{display:inline-flex;gap:5px;align-items:center}
.bright{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.bright b{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .vic{margin:0 auto 12px;width:52px;height:52px}
.empty p{margin-bottom:12px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ===== Calendar ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.cal .dh{padding:8px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.cc{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cc:nth-child(7n){border-right:0}
.cc.out{background:var(--bg);opacity:.7}
.cc.today .cn{background:var(--primary);color:var(--on-primary)}
.cc:hover{background:var(--primary-soft)}
.cn{font-size:12.5px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.chip{border:0;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:700;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;width:100%}
.chip.terjadwal{background:var(--primary);color:var(--on-primary)}
.chip.berjalan{background:var(--amber);color:#2b1c00}
.chip.selesai{background:var(--ok-soft);color:var(--ok)}
.more{font-size:11px;color:var(--muted);padding-left:4px}

/* ===== Harga ===== */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.vcard{padding:18px;display:flex;flex-direction:column;gap:14px}
.vhead{display:flex;gap:12px;align-items:center}
.vhead h3{font-size:17px;line-height:1.2}
.vhead small{color:var(--muted)}
.prices div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.prices span{color:var(--muted)}
.prices b{font-variant-numeric:tabular-nums;text-align:right}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.vnext{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pk-price{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.pk-price small{font-family:var(--font);font-weight:500;color:var(--muted);font-size:13px}
.incl{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-size:13.5px}
.incl li{display:flex;gap:8px;align-items:flex-start}
.incl svg{color:var(--ok);flex:none;margin-top:3px}
.note{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--primary-soft);font-size:13.5px;display:flex;gap:10px}

/* ===== Keuangan ===== */
.mnav{display:inline-flex;align-items:center;gap:8px}
.mnav b{min-width:150px;text-align:center;font-family:var(--display);font-size:18px}
.txrow{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:11px 6px;border-bottom:1px solid var(--line)}
.txrow:last-child{border-bottom:0}
.txic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.txic.in{background:rgba(22,163,74,.14);color:var(--ok)}
.txic.out{background:rgba(220,38,38,.12);color:var(--bad)}
.txamt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.txbtns{display:flex;gap:2px}
.bars{display:grid;gap:12px}
.bar-r .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bar-r .t b{font-variant-numeric:tabular-nums}
.bar-r .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-r .b i{display:block;height:100%;border-radius:99px;background:var(--amber)}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.chart .c-in{fill:var(--primary)}
svg.chart .c-out{fill:var(--amber)}
svg.chart line{stroke:var(--line)}

/* ===== Forms & modal ===== */
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;margin-bottom:12px;min-width:0}
.fld input,.fld select,.fld textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:400;font-size:15px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:70px}
.fld small{color:var(--muted);font-weight:400}
.fld .mh{color:var(--primary);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600}
.chips button:hover{border-color:var(--primary);color:var(--primary)}
.warnbox{background:rgba(245,158,11,.16);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;margin-bottom:10px}
.chk input{width:18px;height:18px;accent-color:var(--primary)}
.ov{position:fixed;inset:0;background:rgba(8,16,15,.55);display:grid;place-items:center;padding:20px;z-index:100;overflow:auto}
.ov.cf{z-index:150}
.dlg{background:var(--surface);color:var(--ink);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dlg.wide{width:min(720px,100%)}
.dlg.sm{width:min(400px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 12px}
.dlg-h h3{font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.dlg-b{padding:4px 20px 18px;overflow:auto}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:12px 0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;word-break:break-word}
.moneybox{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.moneybox .r{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.moneybox .r b{font-variant-numeric:tabular-nums}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.mini-tx{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mini-tx:last-child{border-bottom:0}

/* ===== Settings ===== */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.set-card .card-b{padding-top:12px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.icons button{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icons button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input[type=color]{width:40px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
details.how{font-size:13.5px;margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
details.how summary{font-weight:700;cursor:pointer}
details.how ol{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
code{background:var(--primary-soft);padding:1px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.bad{background:#991b1b;color:#fff}
.toast.out{opacity:0;transition:opacity .35s}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Responsive ===== */
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.cols.even,.sgrid{grid-template-columns:1fr}}
@media (max-width:900px){
  .side{display:none}
  .wrap{margin-left:0}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:25}
  .mtop .brand{padding:0}
  .mtop .logo{width:36px;height:36px}
  .mtop .iconbtn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
  .main{padding:18px 16px 110px}
  .top h1{font-size:25px}
  .desk{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--muted);border-radius:10px}
  .bnav button.on{color:var(--primary);font-weight:700}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:0;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:29}
  #toasts{left:16px;bottom:calc(84px + env(safe-area-inset-bottom))}
  .hero{padding:22px 20px 30px}
  .hero h2{font-size:25px}
}
@media (max-width:700px){

function hexToRgb(h){h=String(h||'#000000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);if(isNaN(n))return[0,0,0];return[(n>>16)&255,(n>>8)&255,n&255];}
function lum(c){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]);}
function mix(a,b,t){return a.map((v,i)=>Math.round(v*(1-t)+b[i]*t));}
const rgbS=a=>`rgb(${a.join(',')})`;
function applyTheme(){
  const s=DB.settings,r=document.documentElement.style;
  const p=hexToRgb(s.primary),bg=hexToRgb(s.bg),dark=lum(bg)<0.25;
  const surface=dark?mix(bg,[255,255,255],0.06):mix(bg,[255,255,255],0.78);
  const ink=dark?[236,242,240]:[20,33,31];
  const muted=mix(ink,surface,dark?0.4:0.42);
  const line=mix(surface,ink,dark?0.16:0.12);
  const on=lum(p)>0.42?[18,24,23]:[255,255,255];
  r.setProperty('--primary',s.primary);
  r.setProperty('--on-primary',rgbS(on));
  r.setProperty('--primary-soft',rgbS(mix(p,surface,dark?0.82:0.88)));
  r.setProperty('--bg',s.bg);
  r.setProperty('--surface',rgbS(surface));
  r.setProperty('--ink',rgbS(ink));
  r.setProperty('--muted',rgbS(muted));
  r.setProperty('--line',rgbS(line));
  r.setProperty('--side',rgbS(dark?mix(bg,[0,0,0],0.35):mix(p,[0,0,0],0.74)));
  r.setProperty('--ok',dark?'#4ade80':'#15803d');
  r.setProperty('--warn',dark?'#fbbf24':'#b45309');
  r.setProperty('--bad',dark?'#f87171':'#b91c1c');
  r.setProperty('--info',dark?'#60a5fa':'#1d4ed8');
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',s.primary);
}

function eff(b){
  if(b.status==='batal'||b.status==='selesai')return b.status;
  return Date.now()<pd(b.start).getTime()?'terjadwal':'berjalan';
}
const overdue=b=>eff(b)==='berjalan'&&Date.now()>pd(b.end).getTime();
function statusPill(b){
  const s=eff(b);
  if(overdue(b))return `<span class="pill bad">Perlu diselesaikan</span>`;
  const m={terjadwal:['info','Akan mulai'],berjalan:['warn','Berjalan'],selesai:['ok','Selesai'],batal:['mute','Dibatalkan']}[s];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function payPill(b){
  if(b.status==='batal')return '';
  const rest=b.total-paid(b);
  if(b.total<=0)return '';
  return rest<=0?`<span class="pill ok">Lunas</span>`:`<span class="pill warn">Sisa ${rp(rest)}</span>`;
}
function rel(b){
  const st=eff(b),n=Date.now(),s=pd(b.start).getTime(),e=pd(b.end).getTime();
  const fmt=ms=>{const m=Math.round(Math.abs(ms)/6e4);if(m<60)return m+' menit';const h=Math.round(m/60);if(h<48)return h+' jam';return Math.round(h/24)+' hari';};
  if(st==='terjadwal')return 'Mulai dalam '+fmt(s-n);
  if(st==='berjalan')return n<=e?'Selesai dalam '+fmt(e-n):'Lewat '+fmt(n-e)+' dari jadwal';
  return '';
}
function findConflicts(vehicleId,start,end,ignoreId){
  const s=pd(start),e=pd(end);
  return DB.bookings.filter(b=>b.id!==ignoreId&&b.vehicleId===vehicleId&&b.status!=='batal'&&pd(b.start)<e&&s<pd(b.end));

const sumT=(type,a,b)=>DB.transactions.reduce((x,t)=>{if(t.type!==type)return x;const d=pd(t.date);return d>=a&&d<b?x+(Number(t.amount)||0):x;},0);

function chart6(){
  const now=new Date(),arr=[];
  for(let i=5;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1),b=new Date(now.getFullYear(),now.getMonth()-i+1,1);arr.push({l:MON[a.getMonth()],i:sumT('in',a,b),o:sumT('out',a,b)});}
  const max=Math.max(1,...arr.map(x=>Math.max(x.i,x.o)));
  const W=600,H=230,pl=6,pb=28,pt=18,ch=H-pb-pt,slot=(W-pl*2)/6,bw=Math.min(28,slot/2-6);
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ch-ch*f;g+=`<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}"/>`;});
  arr.forEach((x,i)=>{
    const cx=pl+slot*i+slot/2,hi=x.i/max*ch,ho=x.o/max*ch;
    g+=`<rect class="c-in" x="${cx-bw-2}" y="${pt+ch-hi}" width="${bw}" height="${Math.max(hi,1)}" rx="4"/>`;
    g+=`<rect class="c-out" x="${cx+2}" y="${pt+ch-ho}" width="${bw}" height="${Math.max(ho,1)}" rx="4"/>`;
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle">${x.l}</text>`;
    if(x.i>0)g+=`<text x="${cx-bw/2-2}" y="${pt+ch-hi-5}" text-anchor="middle">${rpShort(x.i)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik pemasukan dan pengeluaran 6 bulan terakhir">${g}</svg>
  <div class="legend" style="margin-top:6px"><span><i style="background:var(--primary)"></i>Pemasukan</span><span><i style="background:var(--amber)"></i>Pengeluaran</span></div>`;
}
function gantt(){
  const start=new Date();start.setHours(0,0,0,0);const N=14,end=new Date(start);end.setDate(end.getDate()+N);
  const head=Array.from({length:N},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return `<div class="g-day ${i===0?'today':''} ${d.getDay()===0||d.getDay()===6?'wk':''}"><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b></div>`;}).join('');
  const vs=DB.vehicles.filter(v=>v.status!=='nonaktif');
  if(!vs.length)return empty('car','Belum ada armada. Tambahkan armada di menu Harga & Armada.');
  const rows=vs.map(v=>{
    const bs=DB.bookings.filter(b=>b.vehicleId===v.id&&b.status!=='batal'&&pd(b.end)>start&&pd(b.start)<end);
    const bars=bs.map(b=>{
      const s=Math.max(pd(b.start).getTime(),start.getTime()),e=Math.min(pd(b.end).getTime(),end.getTime());
      const left=(s-start)/(end-start)*100,w=Math.max((e-s)/(end-start)*100,2.5);
      return `<button class="g-bar ${eff(b)}" style="left:${left}%;width:${w}%" data-act="view-booking" data-id="${b.id}" title="${esc(b.customer)}, ${fDT(pd(b.start))} - ${fDT(pd(b.end))}"><span>${esc(b.customer)}</span></button>`;
    }).join('');
    return `<div class="g-row"><div class="g-name"><div class="vic">${icon(CAT_ICON[v.cat]||'car',18)}</div><div style="min-width:0"><b>${esc(v.name)}</b><small>${esc(v.plate)}${v.status==='servis'?' (servis)':''}</small></div></div><div class="g-track ${v.status==='servis'?'svc':''}">${bars}</div></div>`;
  }).join('');
  return `<div class="g-scroll"><div class="gantt"><div class="g-row g-headrow"><div class="g-name"></div><div class="g-days">${head}</div></div>${rows}</div></div>`;
}

  const recv=DB.bookings.filter(b=>b.status!=='batal').reduce((x,b)=>x+Math.max(0,b.total-paid(b)),0);
  const recvN=DB.bookings.filter(b=>b.status!=='batal'&&b.total-paid(b)>0).length;

  else body=`${`<div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${state.jTab===t[0]?'on':''}" data-act="jtab" data-v="${t[0]}" role="tab">${t[1]} <i>${groups[t[0]].length}</i></button>`).join('')}</div>`}

  return head('Jadwal','Pantau jadwal yang akan mulai, sedang berjalan, dan sudah selesai.',`<button class="btn" data-act="ics-all">${icon('download',16)} Unduh .ics</button><button class="btn primary" data-act="new-booking">${icon('plus',16)} Booking baru</button>`)+toolbar+body;
}
function calView(){
  const m=state.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const off=(new Date(y,mo,1).getDay()+6)%7,startD=new Date(y,mo,1-off),today=toD(new Date());
  let cells=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(startD.getFullYear(),startD.getMonth(),startD.getDate()+i),ds=toD(d),e0=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    const list=DB.bookings.filter(b=>b.status!=='batal'&&pd(b.start)<e0&&pd(b.end)>=d).sort((a,b)=>pd(a.start)-pd(b.start));
    const chips=list.slice(0,3).map(b=>{const v=vehicle(b.vehicleId);return `<button class="chip ${eff(b)}" data-act="view-booking" data-id="${b.id}" title="${esc(b.customer)}">${esc(b.customer)}${v?' ('+esc(v.name)+')':''}</button>`;}).join('');
    cells+=`<div class="cc ${d.getMonth()!==mo?'out':''} ${ds===today?'today':''}" data-act="new-booking" data-date="${ds}"><span class="cn">${d.getDate()}</span>${chips}${list.length>3?`<span class="more">+${list.length-3} lagi</span>`:''}</div>`;
  }
  return `<div class="toolbar"><div class="mnav"><button class="iconbtn" data-act="cal-prev" aria-label="Bulan sebelumnya">${icon('chevL')}</button><b>${MONTHS[mo]} ${y}</b><button class="iconbtn" data-act="cal-next" aria-label="Bulan berikutnya">${icon('chevR')}</button></div><button class="btn sm" data-act="cal-today">Bulan ini</button></div><div class="cal">${cells}</div>
  <p class="mute" style="margin-top:10px;font-size:13px">Ketuk tanggal untuk membuat booking di hari itu.</p>`;
}

function bookingForm(id,preset){
  preset=preset||{};
  const edit=id?getB(id):null;
  const day=preset.date||toD(new Date(Date.now()+864e5));
  const b=edit||{customer:'',phone:'',service:preset.service||'driver',vehicleId:preset.vehicleId||((DB.vehicles.find(v=>v.status==='aktif')||{}).id||''),packageId:preset.packageId||(DB.packages[0]||{}).id||'',start:day+'T07:00',end:day+'T19:00',pickup:'',dest:'',driver:'',pax:preset.service==='paket'?10:'',total:'',note:''};
  const vopts=DB.vehicles.filter(v=>v.status==='aktif'||v.id===b.vehicleId).map(v=>[v.id,`${v.name} (${v.plate||'tanpa plat'})`]);
  const body=`<div id="bf">
    <div class="grid2">${fld('Nama pelanggan *',inp('customer',b.customer,'placeholder="Nama pelanggan / instansi" autocomplete="off"'))}${fld('No. WhatsApp',inp('phone',b.phone,'type="tel" placeholder="08xxxxxxxxxx"'))}</div>
    <div class="grid2">${fld('Layanan',sel('service',Object.entries(SERVICE),b.service))}${fld('Armada *',vopts.length?sel('vehicleId',vopts,b.vehicleId):'<select name="vehicleId"><option value="">Belum ada armada</option></select>')}</div>
    <div class="grid2"><div id="pkfld">${fld('Paket liburan',sel('packageId',DB.packages.map(p=>[p.id,`${p.name} (${rp(p.price)}/org)`]),b.packageId))}</div>${fld('Jumlah penumpang',inp('pax',b.pax,'type="number" min="0" inputmode="numeric"'))}</div>
    <div class="grid2">${fld('Mulai *',inp('start',b.start,'type="datetime-local"'))}${fld('Selesai *',inp('end',b.end,'type="datetime-local"'))}</div>
    <div id="cw"></div>
    <div class="grid2">${fld('Titik jemput',inp('pickup',b.pickup,'placeholder="Alamat jemput"'))}${fld('Tujuan',inp('dest',b.dest,'placeholder="Kota / lokasi tujuan"'))}</div>
    <div class="grid2">${fld('Nama driver',inp('driver',b.driver,'placeholder="Kosongkan jika lepas kunci"'))}${fld('Total harga (Rp)',money('total',b.total===0?'':b.total),'<span id="est"></span>')}</div>
    ${edit?'':fld('Pembayaran awal / DP (Rp)',money('dp',''),'Otomatis dicatat sebagai pemasukan.')}
    ${fld('Catatan',`<textarea name="note" rows="2" placeholder="Permintaan khusus, rute, jam jemput, dll.">${esc(b.note)}</textarea>`)}
    <label class="chk"><input type="checkbox" name="gsync" ${gcalConnected()&&DB.settings.gcal.autoSync?'checked':''} ${gcalConnected()?'':'disabled'}> Sinkronkan ke Google Calendar ${gcalConnected()?'':'(hubungkan dulu di Pengaturan, atau pakai tombol di detail jadwal)'}</label></div>`;
  openModal({title:edit?'Ubah booking':'Booking baru',wide:true,body:body,
    footer:`<button class="btn" data-act="close-modal">Batal</button><button class="btn primary" data-act="save-booking" data-id="${edit?edit.id:''}">${icon('check',16)} Simpan booking</button>`,
    onMount:dlg=>{
      const root=$('#bf',dlg);let dirty=!!edit&&b.total>0;
      const g=n=>$(`[name="${n}"]`,root);
      const sync=()=>{
        const f=readForm(root);
        $('#pkfld',root).style.display=f.service==='paket'?'':'none';
        const v=vehicle(f.vehicleId),days=daysOf(f),total=calcTotal(f);
        let est='';
        if(f.service==='paket'){const p=DB.packages.find(x=>x.id===f.packageId);est=p?`${f.pax||0} orang x ${rp(p.price)} = ${rp(total)}`:'Pilih paket liburan.';}
        else if(v){const u=f.service==='self'?v.priceSelf:f.service==='out'?v.priceOut:v.priceDriver;est=u>0?`Estimasi: ${days} hari x ${rp(u)} = ${rp(total)}`:'Layanan ini tidak tersedia untuk armada terpilih. Isi total manual.';}
        $('#est',root).textContent=est;
        if(!dirty){g('total').value=total>0?total:'';const h=g('total').parentNode.querySelector('.mh');if(h)h.textContent=total>0?rp(total):'';}
        const cf=f.vehicleId&&f.start&&f.end?findConflicts(f.vehicleId,f.start,f.end,edit?edit.id:''):[];
        $('#cw',root).innerHTML=cf.length?`<div class="warnbox">${icon('alert',18)}<span>Armada ini sudah dipakai pada waktu tersebut oleh ${cf.map(x=>esc(x.customer)).join(', ')}.</span></div>`:'';
      };

async function saveBooking(id){
  const root=$('#bf');if(!root)return;
  const f=readForm(root),edit=id?getB(id):null;
  const bad=(n,m)=>{toast(m,'bad');const el=$(`[name="${n}"]`,root);if(el)el.focus();};
  if(!f.customer)return bad('customer','Nama pelanggan wajib diisi.');
  if(!f.vehicleId)return bad('vehicleId','Pilih armada terlebih dulu. Tambahkan armada di menu Harga & Armada.');
  if(!f.start||!f.end||isNaN(pd(f.start))||isNaN(pd(f.end)))return bad('start','Tanggal mulai dan selesai wajib diisi.');
  if(pd(f.end)<=pd(f.start))return bad('end','Waktu selesai harus setelah waktu mulai.');
  if(f.service==='paket'&&!f.packageId)return bad('packageId','Pilih paket liburan.');
  const total=Number(f.total)||0;
  const cf=findConflicts(f.vehicleId,f.start,f.end,edit?edit.id:'');
  if(cf.length){const ok=await ask('Jadwal bentrok',`Armada sudah dipakai oleh ${cf.map(x=>x.customer).join(', ')} pada waktu tersebut. Tetap simpan?`,'Tetap simpan');if(!ok)return;}
  let b;
  const data={customer:f.customer,phone:f.phone,service:f.service,vehicleId:f.vehicleId,packageId:f.service==='paket'?f.packageId:'',start:f.start,end:f.end,pickup:f.pickup,dest:f.dest,driver:f.driver,pax:f.pax===''?0:f.pax,total:total,note:f.note};
  if(edit){Object.assign(edit,data);b=edit;}
  else{
    b=Object.assign({id:uid('b'),code:genCode(),status:'aktif',gcalId:''},data);
    DB.bookings.push(b);
    const dp=Number(f.dp)||0;
    if(dp>0)DB.transactions.push({id:uid('t'),date:toD(new Date()),type:'in',cat:'DP sewa',amount:dp,note:'DP '+b.code,bookingId:b.id});
  }
  save();closeModal();render();toast(edit?'Booking diperbarui.':'Booking tersimpan.');
  if(f.gsync&&gcalConnected())afterBookingChange(b,true);
  viewBooking(b.id);
}

/* =========================================================
   Google Calendar, ICS, salin harga, unduh
========================================================= */
const GC={token:null,exp:0,loading:null};
const gcalConnected=()=>!!GC.token&&Date.now()<GC.exp-30000;
function gcalDesc(b){const v=vehicle(b.vehicleId);return `Kode: ${b.code}\nPelanggan: ${b.customer}${b.phone?' ('+b.phone+')':''}\nArmada: ${v?v.name+' '+(v.plate||''):'-'}\nDriver: ${b.driver||'-'}\nTujuan: ${b.dest||'-'}\nTotal: ${rp(b.total)}${b.note?'\nCatatan: '+b.note:''}`;}
function gcalTitle(b){const v=vehicle(b.vehicleId);return `${SERVICE[b.service]}: ${b.customer}${v?' ('+v.name+')':''}`;}
function gcalUrl(b){
  const f=s=>String(s).replace(/[-:]/g,'')+'00';
  const p=new URLSearchParams({action:'TEMPLATE',text:gcalTitle(b),dates:`${f(b.start)}/${f(b.end)}`,details:gcalDesc(b),location:b.pickup||'',ctz:TZ});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function icsFor(list){
  const f=s=>String(s).replace(/[-:]/g,'')+'00',ie=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rental Dashboard//ID','CALSCALE:GREGORIAN'];
  list.forEach(b=>{L.push('BEGIN:VEVENT','UID:'+b.id+'@rental-dashboard','DTSTAMP:'+stamp,'DTSTART:'+f(b.start),'DTEND:'+f(b.end),'SUMMARY:'+ie(gcalTitle(b)),'LOCATION:'+ie(b.pickup||''),'DESCRIPTION:'+ie(gcalDesc(b)),'BEGIN:VALARM','TRIGGER:-PT24H','ACTION:DISPLAY','DESCRIPTION:Pengingat jadwal','END:VALARM','END:VEVENT');});
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function download(name,text,mime){
  try{
    const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
  }catch(e){toast('Unduhan diblokir oleh browser.','bad');}
}
function loadGIS(){
  if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return Promise.resolve();
  if(GC.loading)return GC.loading;
  GC.loading=new Promise((res,rej)=>{
    const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
    sc.onload=()=>res();sc.onerror=()=>{GC.loading=null;rej(new Error('Tidak bisa memuat Google Sign-In. Periksa koneksi internet.'));};
    document.head.appendChild(sc);
  });
  return GC.loading;
}
async function gcalToken(force){
  const cid=(DB.settings.gcal.clientId||'').trim();
  if(!cid)throw new Error('Isi Google Client ID di Pengaturan terlebih dulu.');
  if(!force&&gcalConnected())return GC.token;
  await loadGIS();
  return new Promise((resolve,reject)=>{
    try{
      const client=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/calendar.events',
        callback:r=>{if(r.error){reject(new Error(r.error_description||r.error));return;}GC.token=r.access_token;GC.exp=Date.now()+(Number(r.expires_in)||3600)*1000;resolve(GC.token);},
        error_callback:err=>reject(new Error('Izin Google dibatalkan atau diblokir'+(err&&err.type?' ('+err.type+')':'')+'.'))});
      client.requestAccessToken({prompt:GC.token?'':'consent'});
    }catch(e){reject(e);}
  });
}
async function gcalApi(method,path,body){
  let tok=await gcalToken();
  const url='https://www.googleapis.com/calendar/v3/calendars/primary/events'+(path||'');
  const go=t=>fetch(url,{method:method,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let r=await go(tok);
  if(r.status===401){tok=await gcalToken(true);r=await go(tok);}
  return r;
}
function gcalEvent(b){
  return{summary:gcalTitle(b),location:b.pickup||'',description:gcalDesc(b),start:{dateTime:b.start+':00',timeZone:TZ},end:{dateTime:b.end+':00',timeZone:TZ},
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:1440},{method:'popup',minutes:120}]}};
}
async function gcalSync(b){
  const ev=gcalEvent(b);let r;
  if(b.gcalId){r=await gcalApi('PUT','/'+encodeURIComponent(b.gcalId),ev);if(r.status===404||r.status===410)b.gcalId='';}
  if(!b.gcalId)r=await gcalApi('POST','',ev);
  if(!r.ok)throw new Error('Google Calendar menolak permintaan (kode '+r.status+').');
  const j=await r.json();b.gcalId=j.id;save();return j;
}
async function gcalRemove(b){
  if(!b.gcalId||!gcalConnected())return;
  try{await gcalApi('DELETE','/'+encodeURIComponent(b.gcalId));}catch(e){}
  b.gcalId='';save();
}
async function afterBookingChange(b,force){
  if(!gcalConnected())return;
  if(b.status==='batal'){await gcalRemove(b);return;}
  if(!force&&!DB.settings.gcal.autoSync)return;
  try{await gcalSync(b);render();toast('Jadwal masuk ke Google Calendar.');}catch(e){toast(e.message,'bad');}
}
function priceText(){
  const s=DB.settings;let t='';
  if(state.hTab==='armada'){

    DB.vehicles.filter(v=>v.status!=='nonaktif').forEach(v=>{

  }
  return t+s.priceNote+`\n\nInfo & pemesanan: ${s.phone}`;
}
async function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
}

async function pushNotif(title,body,tag){
  DB.notifLog.unshift({id:uid('n'),t:Date.now(),title:title,body:body,read:false});
  DB.notifLog=DB.notifLog.slice(0,60);save();updateBadge();toast(title);

      if(reg){await reg.showNotification(title,{body:body,tag:tag||'rental',vibrate:[200,100,200]});return;}
    }catch(e){}
    try{new Notification(title,{body:body,tag:tag||'rental'});}catch(e){}
  }
}
function tick(){
  if(!DB||!DB.settings.notif.enabled)return;
  const now=Date.now();let changed=false;
  DB.bookings.forEach(b=>{
    if(b.status!=='aktif')return;
    const st=pd(b.start).getTime(),en=pd(b.end).getTime(),v=vehicle(b.vehicleId);
    if(isNaN(st))return;
    LEADS.forEach(l=>{
      if(!DB.settings.notif.leads.includes(l[0]))return;
      const key=b.id+':'+l[0];if(DB.notified[key])return;
      const at=st-l[2]*6e4,ok=l[2]>0?(now>=at&&now<st):(now>=st&&now<st+2*36e5);
      if(!ok)return;
      DB.notified[key]=1;changed=true;
      const label=l[0]==='d1'?'besok':l[0]==='h3'?'3 jam lagi':'sekarang';
      pushNotif(`Jadwal ${label}: ${b.customer}`,`${v?v.name:'Armada'}, ${fDT(pd(b.start))}${b.pickup?', jemput '+b.pickup:''}`,key);
    });
    const ok2=b.id+':over';
    if(now>en&&now<en+7*864e5&&!DB.notified[ok2]){DB.notified[ok2]=1;changed=true;pushNotif(`Jadwal ${b.customer} sudah lewat`,'Tandai selesai dan cek pelunasan.',ok2);}
  });
  if(changed)save();
}
function bellModal(){
  const L=DB.notifLog;
  openModal({title:'Notifikasi',body:L.length?L.map(n=>`<div class="mini-tx" style="align-items:flex-start"><span><b>${esc(n.title)}</b><br><small class="mute">${esc(n.body)}</small></span><small class="mute" style="white-space:nowrap">${fDT(new Date(n.t))}</small></div>`).join(''):empty('bell','Belum ada notifikasi. Aktifkan pengingat di Pengaturan.'),
    footer:L.length?`<button class="btn" data-act="notif-clear">Kosongkan</button><button class="btn primary" data-act="close-modal">Tutup</button>`:''});
  DB.notifLog.forEach(n=>n.read=true);save();updateBadge();
}
function registerSW(){try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}

/* =========================================================
   Aksi (event delegation)
========================================================= */
function setPath(path,val){const p=path.split('.');let o=DB.settings;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
const actions={
  nav:d=>{state.view=d.v;render();window.scrollTo(0,0);},
  'go-jadwal':d=>{state.view='jadwal';state.jTab=d.tab;state.jView='list';render();window.scrollTo(0,0);},
  jtab:d=>{state.jTab=d.v;render();},
  jview:d=>{state.jView=d.v;render();},
  htab:d=>{state.hTab=d.v;render();},
  ftype:d=>{state.fType=d.v;render();},
  'cal-prev':()=>{const m=state.calMonth;state.calMonth=new Date(m.getFullYear(),m.getMonth()-1,1);render();},
  'cal-next':()=>{const m=state.calMonth;state.calMonth=new Date(m.getFullYear(),m.getMonth()+1,1);render();},
  'cal-today':()=>{state.calMonth=firstOfMonth(new Date());render();},
  'f-prev':()=>{const m=state.fMonth;state.fMonth=new Date(m.getFullYear(),m.getMonth()-1,1);render();},
  'f-next':()=>{const m=state.fMonth;state.fMonth=new Date(m.getFullYear(),m.getMonth()+1,1);render();},
  'close-modal':()=>closeModal(),
  'ov-close':(d,el,ev)=>{if(ev.target===el)closeModal();},
  bell:()=>bellModal(),
  'notif-clear':()=>{DB.notifLog=[];save();updateBadge();closeModal();},
  'new-booking':d=>bookingForm(null,{date:d.date,service:d.service,packageId:d.package}),
  'edit-booking':d=>bookingForm(d.id),
  'view-booking':d=>viewBooking(d.id),
  'save-booking':d=>saveBooking(d.id),
  'finish-booking':async d=>{
    const b=getB(d.id);if(!b)return;
    b.status='selesai';save();render();viewBooking(b.id);toast('Jadwal ditandai selesai.');
    const rest=b.total-paid(b);
    if(rest>0){const ok=await ask('Sisa tagihan belum lunas',`Masih ada sisa ${rp(rest)}. Catat pelunasan sekarang?`,'Catat pelunasan');if(ok)txForm(null,{type:'in',cat:'Pelunasan',amount:rest,bookingId:b.id,back:true});}
  },
  'reopen-booking':d=>{const b=getB(d.id);if(!b)return;b.status='aktif';save();render();viewBooking(b.id);toast('Jadwal dibuka kembali.');afterBookingChange(b);},
  'cancel-booking':async d=>{
    const b=getB(d.id);if(!b)return;
    if(!await ask('Batalkan jadwal?',`Jadwal ${b.customer} akan ditandai dibatalkan. Catatan keuangan tetap tersimpan.`,'Batalkan jadwal',true))return;
    b.status='batal';save();render();viewBooking(b.id);toast('Jadwal dibatalkan.');afterBookingChange(b);
  },
  'del-booking':async d=>{
    const b=getB(d.id);if(!b)return;
    if(!await ask('Hapus jadwal?',`Jadwal ${b.customer} akan dihapus permanen. Catatan keuangan yang terhubung tetap disimpan tanpa tautan.`,'Hapus',true))return;
    await gcalRemove(b);
    DB.transactions.forEach(t=>{if(t.bookingId===b.id)t.bookingId='';});
    DB.bookings=DB.bookings.filter(x=>x.id!==b.id);save();closeModal();render();toast('Jadwal dihapus.');
  },
  'new-tx':d=>txForm(null,{type:d.type,bookingId:d.booking,cat:d.cat,amount:d.amount?Number(d.amount):'',back:!!d.back}),
  'edit-tx':d=>txForm(d.id),
  'save-tx':d=>saveTx(d.id,!!d.back),
  'del-tx':async d=>{if(!await ask('Hapus transaksi?','Transaksi ini akan dihapus permanen.','Hapus',true))return;DB.transactions=DB.transactions.filter(t=>t.id!==d.id);save();render();toast('Transaksi dihapus.');},
  'pick-cat':d=>{const el=$('#tf [name="cat"]');if(el)el.value=d.v;},
  'new-vehicle':()=>vehicleForm(null),
  'edit-vehicle':d=>vehicleForm(d.id),
  'save-vehicle':d=>saveVehicle(d.id),
  'del-vehicle':async d=>{
    const n=DB.bookings.filter(b=>b.vehicleId===d.id).length;
    if(n){toast(`Armada dipakai di ${n} jadwal. Ubah statusnya menjadi Nonaktif.`,'bad');return;}
    if(!await ask('Hapus armada?','Armada ini akan dihapus dari daftar.','Hapus',true))return;
    DB.vehicles=DB.vehicles.filter(v=>v.id!==d.id);save();render();toast('Armada dihapus.');
  },
  'new-package':()=>packageForm(null),
  'edit-package':d=>packageForm(d.id),
  'save-package':d=>savePackage(d.id),
  'del-package':async d=>{
    const n=DB.bookings.filter(b=>b.packageId===d.id).length;
    if(n){toast(`Paket dipakai di ${n} jadwal dan tidak bisa dihapus.`,'bad');return;}
    if(!await ask('Hapus paket?','Paket ini akan dihapus dari daftar.','Hapus',true))return;
    DB.packages=DB.packages.filter(p=>p.id!==d.id);save();render();toast('Paket dihapus.');
  },
  'copy-prices':async()=>{toast(await copyText(priceText())?'Daftar harga disalin. Tempel di WhatsApp.':'Gagal menyalin daftar harga.',await copyText('')?'ok':'ok');},
  csv:()=>{
    const a=state.fMonth,b=new Date(a.getFullYear(),a.getMonth()+1,1),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const rows=DB.transactions.filter(t=>{const d=pd(t.date);return d>=a&&d<b;}).sort((x,y)=>pd(x.date)-pd(y.date));
    const lines=['Tanggal,Jenis,Kategori,Jumlah,Catatan,Jadwal'].concat(rows.map(t=>{const bk=getB(t.bookingId);return [t.date,t.type==='in'?'Pemasukan':'Pengeluaran',q(t.cat),t.amount,q(t.note),q(bk?bk.code+' '+bk.customer:'')].join(',');}));
    download(`keuangan-${a.getFullYear()}-${pad(a.getMonth()+1)}.csv`,'\ufeff'+lines.join('\n'),'text/csv');
  },
  'ics-one':d=>{const b=getB(d.id);if(b)download(`${b.code}.ics`,icsFor([b]),'text/calendar');},
  'ics-all':()=>{const l=DB.bookings.filter(b=>b.status==='aktif');if(!l.length){toast('Belum ada jadwal aktif.','bad');return;}download('jadwal-rental.ics',icsFor(l),'text/calendar');},
  'gcal-connect':async()=>{
    try{await gcalToken(true);render();toast('Google Calendar terhubung.');}catch(e){toast(e.message,'bad');}
  },
  'gcal-sync-one':async d=>{const b=getB(d.id);if(!b)return;try{await gcalSync(b);render();viewBooking(b.id);toast('Jadwal disinkronkan.');}catch(e){toast(e.message,'bad');}},
  'gcal-sync-all':async()=>{
    try{await gcalToken();}catch(e){toast(e.message,'bad');return;}
    const l=DB.bookings.filter(b=>b.status==='aktif');let n=0;
    for(const b of l){try{await gcalSync(b);n++;}catch(e){toast(e.message,'bad');break;}}
    render();if(n)toast(`${n} jadwal disinkronkan ke Google Calendar.`);
  },
  'notif-test':async()=>{
    if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
    await pushNotif('Tes notifikasi',`Notifikasi dari ${DB.settings.brand} berfungsi di perangkat ini.`,'test');render();
  },
  'set-icon':d=>{DB.settings.icon=d.v;save();render();},
  'set-color':d=>{DB.settings[d.k]=d.v;save();render();},
  export:()=>download(`cadangan-rental-${toD(new Date())}.json`,JSON.stringify(DB,null,2),'application/json'),
  import:()=>{const f=$('#imp');if(f)f.click();},
  'reset-demo':async()=>{
    if(!await ask('Muat data contoh?','Armada, paket, jadwal, dan keuangan saat ini akan diganti dengan data contoh. Pengaturan tampilan tetap.','Muat data contoh',true))return;
    const s=seed(),keep=DB.settings;DB=s;DB.settings=keep;save();render();toast('Data contoh dimuat.');
  },
  'clear-data':async()=>{
    if(!await ask('Kosongkan data?','Semua jadwal dan transaksi akan dihapus. Armada, paket, dan pengaturan tetap tersimpan.','Kosongkan',true))return;
    DB.bookings=[];DB.transactions=[];DB.notified={};DB.notifLog=[];DB.meta.seq=0;save();render();toast('Jadwal dan keuangan dikosongkan.');
  }
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const fn=actions[el.dataset.act];if(!fn)return;
  ev.preventDefault();
  try{const r=fn(el.dataset,el,ev);if(r&&r.catch)r.catch(e=>toast(e&&e.message?e.message:'Terjadi kesalahan.','bad'));}
  catch(e){toast(e&&e.message?e.message:'Terjadi kesalahan.','bad');}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('#confirm-root').innerHTML){$('#confirm-root').innerHTML='';return;}closeModal();return;}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.brow[role="button"]')){ev.preventDefault();ev.target.click();}
});
function keepFocus(id){
  const el=$('#'+id),pos=el?el.selectionStart:0;
  render();
  const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){state.q=t.value;keepFocus('q');return;}
  if(t.id==='fq'){state.fq=t.value;keepFocus('fq');return;}
  if(t.dataset&&t.dataset.money!==undefined){const h=t.parentNode.querySelector('.mh');if(h)h.textContent=t.value!==''?rp(t.value):'';}
  if(t.dataset&&(t.dataset.set==='primary'||t.dataset.set==='bg')){setPath(t.dataset.set,t.value);applyTheme();saveSoon();}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='imp'){
    const file=t.files&&t.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.bookings)||!Array.isArray(d.vehicles))throw new Error('x');DB=mergeDefaults(d);save();render();toast('Cadangan berhasil dipulihkan.');}catch(e){toast('File cadangan tidak valid.','bad');}};
    rd.readAsText(file);t.value='';return;
  }
  if(t.dataset&&t.dataset.lead){
    const L=DB.settings.notif.leads,k=t.dataset.lead;
    DB.settings.notif.leads=t.checked?Array.from(new Set(L.concat(k))):L.filter(x=>x!==k);save();return;
  }
  if(t.dataset&&t.dataset.set){
    const path=t.dataset.set,val=t.type==='checkbox'?t.checked:t.value;
    setPath(path,val);save();
    if(path==='notif.enabled'&&val&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}toast('Pengingat jadwal aktif.');tick();}
    render();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

/* =========================================================
   Mulai
========================================================= */
(async function init(){
  let d=null;
  try{d=await Store.load();}catch(e){}
  DB=(d&&Array.isArray(d.vehicles)&&Array.isArray(d.bookings))?mergeDefaults(d):seed();
  save();render();registerSW();
  setInterval(tick,30000);setTimeout(tick,2500);
  setInterval(()=>{if(state.view==='dashboard'&&!$('#modal-root').innerHTML&&document.activeElement===document.body)render();},60000);
})();
</script>
