function tick(){
  if(!DB||!DB.settings.notif.enabled)return;
  const now=Date.now();let changed=false;
  DB.bookings.forEach(b=>{
    if(b.status!=='aktif')return;
    const st=pd(b.start).getTime(),en=pd(b.end).getTime(),v=vehicle(b.vehicleId);
    if(isNaN(st))return;
    LEADS.forEach(l=>{
      if(!DB.settings.notif.leads.includes(l[0]))return;
      const key=b.id+':'+l[0];if(DB.notified[key])return;
      const at=st-l[2]*6e4,ok=l[2]>0?(now>=at&&now<st):(now>=st&&now<st+2*36e5);
      if(!ok)return;
      DB.notified[key]=1;changed=true;
      const label=l[0]==='d1'?'besok':l[0]==='h3'?'3 jam lagi':'sekarang';
      pushNotif(`Jadwal ${label}: ${b.customer}`,`${v?v.name:'Armada'}, ${fDT(pd(b.start))}${b.pickup?', jemput '+b.pickup:''}`,key);
    });
    const ok2=b.id+':over';
    if(now>en&&now<en+7*864e5&&!DB.notified[ok2]){DB.notified[ok2]=1;changed=true;pushNotif(`Jadwal ${b.customer} sudah lewat`,'Tandai selesai dan cek pelunasan.',ok2);}
  });
  const today=toD(new Date());
  (DB.invoices||[]).forEach(i=>{
    if(i.status==='batal'||!i.due||i.due>today)return;
    const c=invCalc(i);if(c.rest<=0)return;
    const key='inv:'+i.id+':due';if(DB.notified[key])return;
    DB.notified[key]=1;changed=true;
    pushNotif((i.due===today?'Invoice jatuh tempo hari ini: ':'Invoice lewat jatuh tempo: ')+i.cust,i.no+', sisa '+rp(c.rest),key);
  });
  if(changed)save();
}

  'sync-connect':async(d,el)=>{
    const box=el.closest('.dlg')||el.closest('.card-b')||document;
    const k=box.querySelector('#sync-key'),u=box.querySelector('#sync-url');
    const key=k?k.value.trim():'',url=u?u.value.trim():Sync.cfg.url;
    if(!key&&!Sync.cfg.key){toast('Masukkan kunci akses.','bad');return;}
    if(url!==Sync.cfg.url||(key&&key!==Sync.cfg.key))Sync.cfg.ver=0;
    Sync.cfg.url=url;if(key)Sync.cfg.key=key;Sync.cfg.mode='server';Sync.cfg.etag='';Sync.paused=false;Sync.persist();
    if(!(await Sync.detect())){Sync.set('off','Server tidak ditemukan di alamat tersebut.');toast('Server tidak ditemukan.','bad');return;}
    if($('#modal-root').innerHTML)closeModal();
    await Sync.pull(true);
    clearInterval(Sync._poll);Sync._poll=setInterval(()=>Sync.pull(false),30000);
    if(Sync.state==='ok')toast('Tersambung ke server.');
    if(state.view==='pengaturan')render();
  },
  'gh-connect':async(d,el)=>{
    const box=el.closest('.card-b')||document;
    const repo=((box.querySelector('#gh-repo')||{}).value||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/i,'').replace(/\/+$/,'');
    const tok=((box.querySelector('#gh-token')||{}).value||'').trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast('Tulis repository seperti: nama-akun/nama-repo','bad');return;}
    if(!tok&&!Sync.cfg.gh.token){toast('Masukkan token GitHub.','bad');return;}
    if(repo!==Sync.cfg.gh.repo||(tok&&tok!==Sync.cfg.gh.token)){Sync.cfg.ver=0;Sync.cfg.etag='';}
    Sync.cfg.gh.repo=repo;if(tok)Sync.cfg.gh.token=tok;Sync.cfg.mode='github';Sync.paused=false;Sync.persist();
    await Sync.detect();
    await Sync.pull(true);
    clearInterval(Sync._poll);Sync._poll=setInterval(()=>Sync.pull(false),45000);
    if(Sync.state==='ok')toast('Tersambung ke GitHub.');else if(Sync.state==='error'||Sync.state==='need-key')toast(Sync.msg||'Gagal tersambung.','bad');
    if(state.view==='pengaturan')render();
  },
  'sync-now':async()=>{
    if(!Sync.hasKey()){toast('Sambungkan ke server dulu.','bad');return;}
    Sync.paused=false;await Sync.pull(false);
    if(Sync.state==='ok')toast('Data sudah sinkron.');else if(Sync.state==='error')toast('Sinkron gagal.','bad');
  },
  'sync-force':async()=>{
    if(!Sync.available||!Sync.hasKey()){toast('Sambungkan ke penyimpanan online dulu.','bad');return;}
    if(!await ask('Timpa data di server?','Data di server akan diganti dengan data di perangkat ini. Server menyimpan salinan cadangan otomatis.','Timpa data server',true))return;
    const r=await Sync.call('GET','/api/data?since=-1');
    if(r.status!==200||!r.body){toast('Gagal menghubungi server.','bad');return;}
    Sync.cfg.ver=r.body.version;Sync.paused=false;Sync.persist();await Sync.push();
    if(Sync.state==='ok')toast('Data perangkat ini sudah diunggah.');
  },
  'sync-off':async()=>{
    if(!Sync.cfg.key&&!Sync.cfg.url&&!Sync.cfg.gh.token){toast('Belum tersambung.','bad');return;}
    if(!await ask('Putuskan penyimpanan online?','Data di perangkat ini tetap ada, tetapi tidak lagi disinkronkan.','Putuskan'))return;

function invCalc(i){

function saveInvoice(id){
  const root=$('#inf');if(!root)return;
  const f=invReadForm();
  if(!f.cust){toast('Nama pelanggan wajib diisi.','bad');$('[name="cust"]',root).focus();return;}
  if(!f.items.length){toast('Tambahkan minimal satu item tagihan.','bad');return;}
  if(f.items.some(x=>!x.d)){toast('Setiap item perlu deskripsi.','bad');return;}
  if(!f.issued||!f.due){toast('Tanggal terbit dan jatuh tempo wajib diisi.','bad');return;}
  if(f.due<f.issued){toast('Jatuh tempo tidak boleh sebelum tanggal terbit.','bad');return;}
  const data={cust:f.cust,phone:f.phone,addr:f.addr,issued:f.issued,due:f.due,items:f.items,disc:Number(f.disc)||0,tax:Number(f.tax)||0,note:f.note};
  let inv;
  if(id){inv=getInv(id);if(!inv)return;Object.assign(inv,data);}
  else{
    const bid=root.dataset.bid;
    if(invOf(bid)){toast('Jadwal ini sudah punya invoice aktif.','bad');return;}
    inv=Object.assign({id:uid('i'),no:invNo(),bookingId:bid,status:'aktif',sent:[],created:Date.now()},data);DB.invoices.push(inv);
  }
  save();closeModal();render();toast(id?'Invoice diperbarui.':'Invoice dibuat.');viewInvoice(inv.id);
}
function invCard(){

  const out=act.reduce((t,i)=>t+cs.get(i.id).rest,0),od=act.filter(i=>cs.get(i.id).st==='overdue').length;
  const f=state.iTab||'open',isOpen=i=>{const s=cs.get(i.id).st;return s==='unpaid'||s==='part'||s==='overdue';};
  const rows=all.filter(i=>f==='all'||(f==='open'&&isOpen(i))||(f==='paid'&&cs.get(i.id).st==='paid')),lim=state.iAll?rows:rows.slice(0,6);
  const tabs=[['open','Belum lunas',all.filter(isOpen).length],['paid','Lunas',all.filter(i=>cs.get(i.id).st==='paid').length],['all','Semua',all.length]];

  return `<div class="card" style="margin-top:16px"><div class="card-h"><h3>${icon('list',18)} Invoice</h3><div class="seg">${tabs.map(t=>`<button class="${f===t[0]?'on':''}" data-act="itab" data-v="${t[0]}">${t[1]} <i style="font-style:normal;opacity:.7;font-size:12px">${t[2]}</i></button>`).join('')}</div></div>
    <div class="card-b">${act.length?`<p class="mute" style="font-size:13.5px;margin:2px 0 6px">Belum tertagih <b class="${out?'neg':''}">${rp(out)}</b>${od?` · <span class="neg">${od} jatuh tempo</span>`:''}</p>`:''}
    ${lim.length?lim.map(row).join(''):empty('list',all.length?'Tidak ada invoice pada tab ini.':'Belum ada invoice. Buat dari jadwal, lalu kirim ke pelanggan lewat WhatsApp.',`<button class="btn primary sm" data-act="inv-new">${icon('plus',15)} Invoice baru</button>`)}
    ${rows.length>6?`<button class="btn sm block" style="margin-top:10px" data-act="iall">${state.iAll?'Tampilkan lebih sedikit':'Lihat semua ('+rows.length+')'}</button>`:''}</div></div>`;
}

  const w=window.open(url,'_blank','noopener');if(!w)location.href=url;
  render();viewInvoice(i.id);
  toast(hasNum?'WhatsApp dibuka ke nomor pelanggan.':'WhatsApp dibuka. Pilih kontak pelanggan.');
};
actions['inv-wa-pdf']=async d=>{
  const i=getInv(d.id),root=$('#isf');if(!i||!root)return;
  const f=readForm(root),txt=f.msg||invMsg(i,f.kind),doc=invPdf(i);if(!doc)return;
  const name=invFileName(i),file=new File([doc.output('blob')],name,{type:'application/pdf'});
  if(f.ph)i.phone=f.ph;
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[file]}));}catch(e){}
  if(can){
    try{
      await navigator.share({files:[file],text:txt,title:'Invoice '+i.no});
      invMark(i,'pdf',f.kind);save();render();viewInvoice(i.id);toast('Invoice PDF dibagikan.');
    }catch(e){
      if(e&&e.name==='AbortError')return;
      doc.save(name);toast('Menu bagikan gagal dibuka. PDF diunduh, lampirkan manual di WhatsApp.','bad');
    }
    return;
  }
  doc.save(name);
  invMark(i,'pdf',f.kind);save();
  const url=waUrl(f.ph,txt),w=window.open(url,'_blank','noopener');if(!w)location.href=url;
  render();viewInvoice(i.id);
  toast('PDF diunduh. Di WhatsApp, lampirkan file PDF tersebut.');
};

/* ===== v5: transisi halaman halus + bayangan bilah atas saat scroll ===== */
(function(){
  var pg='[data-act="nav"],[data-act="go-jadwal"]';
  document.addEventListener('click',function(e){
    if(!e.target.closest||!e.target.closest(pg))return;
    requestAnimationFrame(function(){var m=document.getElementById('main');if(!m)return;m.classList.remove('pg-in');void m.offsetWidth;m.classList.add('pg-in');});
  });
  var t=false;
  window.addEventListener('scroll',function(){if(t)return;t=true;requestAnimationFrame(function(){document.body.classList.toggle('scrolled',window.scrollY>6);t=false;});},{passive:true});
})();
</script>
